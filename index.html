<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bone Crush — the daily ossuary puzzle</title>
<meta name="description" content="Match skulls and bones in the catacomb. Everyone on Earth gets the identical board today — top the score before midnight resets it.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:radial-gradient(circle at 50% 30%, #2b1d12 0%, #150e08 55%, #0a0705 100%); touch-action:none;
              font-family:'Segoe UI', system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
  #game { display:block; margin:0 auto; touch-action:none; }
  .ui { position:fixed; color:#e8dcc0; text-shadow:0 0 12px #ff8a00, 0 0 26px #c93400; z-index:5; }
  /* Score readout: BIG, animated (scale-pop + color-flash + count-up driven from render loop). */
  #hud { top:8px; left:16px; font-size:clamp(26px,5.4vw,54px); font-weight:900; letter-spacing:1px;
         transform-origin:top left; will-change:transform; line-height:1; }
  #moves { top:16px; right:64px; font-size:clamp(18px,3vw,30px); font-weight:800; }
  /* Left-side info panel (grim ossuary legend). Sits in the left margin on wide screens,
     collapsible overlay on narrow ones so the board always fits. */
  #infoToggle { top:70px; left:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.85;
                padding:4px 9px; background:rgba(20,16,14,.55); border:1px solid rgba(230,200,140,.3);
                border-radius:10px; z-index:6; }
  #infoPanel { top:112px; left:12px; width:212px; max-height:calc(100vh - 128px); overflow-y:auto;
               padding:12px 12px 14px; z-index:6; border-radius:14px;
               background:linear-gradient(180deg, rgba(28,20,14,.94), rgba(14,10,7,.96));
               border:1px solid rgba(196,150,86,.42);
               box-shadow:0 8px 30px rgba(0,0,0,.6), inset 0 0 26px rgba(120,70,20,.18);
               color:#e5d4ad; font-size:12px; text-shadow:0 1px 2px #000;
               scrollbar-width:thin; scrollbar-color:rgba(196,150,86,.5) transparent; }
  #infoPanel::-webkit-scrollbar { width:7px; }
  #infoPanel::-webkit-scrollbar-thumb { background:rgba(196,150,86,.5); border-radius:6px; }
  #infoPanel h3 { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#ffb454;
                  margin:12px 0 6px; border-bottom:1px solid rgba(196,150,86,.28); padding-bottom:3px;
                  text-shadow:0 0 10px rgba(255,138,0,.4); }
  #infoPanel h3:first-child { margin-top:0; }
  #infoPanel .row { display:flex; align-items:center; gap:8px; margin:4px 0; line-height:1.25; }
  #infoPanel .row img { width:26px; height:26px; flex:0 0 26px; object-fit:contain;
                        filter:drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  #infoPanel .row .nm { color:#f4e6c4; font-weight:700; }
  #infoPanel .row .ds { color:#c3a877; }
  #infoPanel .row .pts { margin-left:auto; color:#ffd24a; font-weight:800; white-space:nowrap; }
  #infoPanel ul { list-style:none; margin:2px 0 0; padding:0; }
  #infoPanel ul li { position:relative; padding:3px 0 3px 14px; color:#d8c39a; line-height:1.3; }
  #infoPanel ul li::before { content:'☠'; position:absolute; left:0; top:2px; color:#a5763a; font-size:10px; }
  #mute { top:8px; right:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.85; padding:4px 8px;
          background:rgba(20,16,14,.5); border:1px solid rgba(230,200,140,.3); border-radius:10px; }
  #bug { top:52px; right:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.6; padding:4px 8px;
         background:rgba(20,16,14,.5); border:1px solid rgba(230,200,140,.3); border-radius:10px; }
  #overlay { inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:radial-gradient(ellipse at center, rgba(18,12,16,.6) 0%, rgba(6,4,7,.92) 100%);
             text-align:center; padding:20px; }
  /* Official BONE CRUSH title logo (Eric's painted banner). Master copy: art_src/title_logo.png
     (5230x768) — THIS is the game logo for the splash, store pages, adverts and promo art.
     assets/title_logo.jpg is the web-optimized copy. Subtle idle float/glow, readable at any width. */
  #overlay h1.logo { display:flex; align-items:center; justify-content:center;
                     margin-bottom:8px; line-height:1;
                     animation:logoFloat 5s ease-in-out infinite, logoEmber 3s ease-in-out infinite; }
  #overlay h1.logo img { width:min(92vw, 640px); height:auto; border-radius:10px;
                     box-shadow:0 4px 22px rgba(0,0,0,.65), 0 0 34px rgba(255,138,0,.35);
                     border:1px solid rgba(230,190,120,.35); }
  @keyframes logoFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes logoEmber { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.13)} }
  @media (prefers-reduced-motion:reduce){ #overlay h1.logo{animation:none} }
  #overlay .tag { font-size:clamp(12px,2.2vw,17px); color:#cbb488; margin-bottom:20px; }
  #overlay .big { font-size:clamp(18px,3.6vw,30px); margin:4px 0; font-weight:700; }
  #overlay .stats { display:flex; gap:22px; margin:12px 0 6px; flex-wrap:wrap; justify-content:center; }
  #overlay .stat { background:rgba(30,24,20,.6); border:1px solid rgba(220,190,130,.25); border-radius:14px;
                   padding:8px 18px; min-width:100px; }
  #overlay .stat .v { font-size:clamp(20px,4vw,32px); font-weight:800; color:#f6ecd7; }
  #overlay .stat .l { font-size:clamp(9px,1.6vw,12px); color:#c9a86a; letter-spacing:2px; text-transform:uppercase; }
  #overlay .go { margin-top:16px; font-size:clamp(15px,2.8vw,22px); padding:12px 40px; border-radius:40px;
                 background:linear-gradient(180deg,#ff9a2a,#c22e00); color:#fff; border:none; cursor:pointer;
                 font-weight:800; letter-spacing:2px; box-shadow:0 0 30px rgba(255,110,0,.55); }
  #overlay .share { margin-top:10px; font-size:clamp(11px,2vw,15px); padding:8px 24px; border-radius:30px;
                    background:rgba(34,26,22,.65); color:#eed9a8; border:1px solid rgba(230,190,120,.4); cursor:pointer; }
  #overlay .hint { margin-top:14px; font-size:clamp(10px,1.9vw,13px); color:#9b7f52; }
  #overlay .daily { margin-top:6px; font-size:clamp(10px,1.9vw,13px); color:#d9a75f; }
  #toast { bottom:8vh; left:50%; transform:translateX(-50%); background:rgba(30,22,18,.9); padding:9px 20px;
           border-radius:22px; border:1px solid rgba(230,190,120,.5); font-size:13px; opacity:0; transition:opacity .3s; }
  .hidden { display:none !important; }
  /* mode select / level select / endless menu / run-end — share the ossuary parchment look */
  #objHud { top:16px; right:64px; margin-top:28px; font-size:clamp(12px,2.1vw,16px); font-weight:700; color:#d9a75f; }
  #menuBtn { top:96px; right:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.75; padding:4px 8px;
             background:rgba(20,16,14,.5); border:1px solid rgba(230,200,140,.3); border-radius:10px; }
  #modeSelect, #levelSelect, #runEnd { inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; background:radial-gradient(ellipse at center, rgba(18,12,16,.6) 0%, rgba(6,4,7,.92) 100%);
             text-align:center; padding:20px; }
  .modeGrid { display:flex; flex-direction:column; gap:14px; margin-top:18px; width:min(92vw, 380px); }
  .modeBtn { display:flex; flex-direction:column; gap:3px; padding:16px 20px; border-radius:18px;
             background:linear-gradient(180deg, rgba(46,34,24,.8), rgba(24,17,12,.85)); color:#f4e6c4;
             border:1px solid rgba(220,190,130,.35); cursor:pointer; font-size:clamp(16px,3vw,22px); font-weight:800;
             letter-spacing:1px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  .modeBtn:hover { border-color:rgba(255,180,80,.7); box-shadow:0 0 24px rgba(255,140,0,.35); }
  .modeSub { font-size:clamp(10px,1.7vw,13px); font-weight:500; color:#c9a86a; letter-spacing:0; }
  .lsTitle { font-size:clamp(20px,3.6vw,30px); color:#f6ecd7; margin-bottom:14px; text-shadow:0 0 14px rgba(255,138,0,.4); }
  .lsGrid { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; width:min(92vw, 480px); }
  .lsCell { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:14px;
            background:rgba(34,26,22,.7); border:1px solid rgba(220,190,130,.3); color:#f4e6c4; cursor:pointer;
            font-weight:800; font-size:15px; }
  .lsCell.locked { color:#7a6a55; cursor:not-allowed; opacity:.6; }
  .lsCell:not(.locked):hover { border-color:rgba(255,180,80,.7); box-shadow:0 0 16px rgba(255,140,0,.3); }
  .lsNum { font-size:18px; }
  .lsStars { font-size:12px; letter-spacing:1px; color:#ffd24a; }
  .back { margin-top:18px; font-size:clamp(12px,2vw,15px); padding:8px 22px; border-radius:26px;
          background:rgba(34,26,22,.65); color:#eed9a8; border:1px solid rgba(230,190,120,.4); cursor:pointer; }
  .reStars { font-size:clamp(24px,4.5vw,36px); color:#ffd24a; letter-spacing:6px; margin:8px 0; text-shadow:0 0 16px rgba(255,180,60,.5); }
  .reBtns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
</style>

<body>
<canvas id="game"></canvas>
<div class="ui" id="hud"></div>
<div class="ui" id="moves"></div>
<div class="ui hidden" id="objHud"></div>
<div class="ui" id="mute">🔊</div>
<div class="ui" id="bug" title="Download bug report (F8)">🐞</div>
<div class="ui" id="menuBtn" title="Back to mode select">🏠</div>
<div class="ui" id="infoToggle" title="Ossuary legend — pieces, powers & rules">📖</div>
<div class="ui hidden" id="infoPanel"></div>
<div class="ui" id="toast"></div>

<!-- PLATFORM_SDK -->
<script>
/* Platform adapter: no-op locally; the build script injects a real PSDK
   (CrazyGames SDK v3 / Poki SDK v2) above this line for store builds. */
window.PSDK = window.PSDK || { ready: Promise.resolve(), loaded(){}, start(){}, stop(){},
                               midgame(){ return Promise.resolve(); } };
</script>

<!-- Daily-mode start/result screen. Cold-open (B1 correction) means this is NEVER shown before the
     first swap anymore — it only appears (a) when the player explicitly taps the DAILY tab, in which
     case beginGame() fires immediately without waiting for a click here, or (b) after a daily run ends,
     showing the score/streak/share result exactly as before. -->
<div class="ui hidden" id="overlay">
  <h1 class="logo"><img src="assets/title_logo.jpg" alt="BONE CRUSH — a grim match-3 adventure"></h1>
  <div class="tag">Match the remains. Everyone on Earth digs the <b>same catacomb board</b> today.</div>
  <div id="resultBlock" class="hidden"><div class="big" id="scoreLine"></div></div>
  <div class="stats">
    <div class="stat"><div class="v" id="stBest">0</div><div class="l">Today's best</div></div>
    <div class="stat"><div class="v" id="stAll">0</div><div class="l">All-time</div></div>
    <div class="stat"><div class="v" id="stStreak">0🔥</div><div class="l">Day streak</div></div>
  </div>
  <button class="go" id="btnGo">DIG AGAIN</button>
  <button class="share hidden" id="btnShare">⚡ Challenge a friend</button>
  <div class="hint">Swap two relics to match 3+ · 30 moves · chains multiply the score</div>
  <div class="daily" id="daily"></div>
</div>
<!-- Non-blocking mode panel — reached ONLY via the 🏠 corner button, never shown automatically.
     The game always cold-opens straight into a live board (campaign frontier level for a fresh
     player, or their current level on return); this panel is purely for switching/pausing. -->
<div class="ui hidden" id="modeSelect">
  <h1 class="logo"><img src="assets/title_logo.jpg" alt="BONE CRUSH"></h1>
  <div class="tag" id="msTag">Switch your dig.</div>
  <div class="modeGrid">
    <button class="modeBtn hidden" id="btnResume">▶ RESUME<span class="modeSub">Back to where you left off</span></button>
    <button class="modeBtn" id="btnCampaign">⚱️ CAMPAIGN<span class="modeSub">Level-by-level ossuary</span></button>
    <button class="modeBtn" id="btnEndless">♾️ ENDLESS<span class="modeSub">Dig till the moves run dry</span></button>
    <button class="modeBtn" id="btnDaily">📅 DAILY<span class="modeSub">Same board as everyone, today</span></button>
  </div>
</div>
<!-- Campaign level picker — reached via the CAMPAIGN tab or the 🏠 panel. Never shown on load. -->
<div class="ui hidden" id="levelSelect">
  <h2 class="lsTitle">⚱️ Campaign</h2>
  <div class="lsGrid" id="lsGrid"></div>
  <button class="back" id="lsBack">‹ Back</button>
</div>
<!-- Campaign/Endless run-end popup (win, lose, or endless-out-of-moves). Built dynamically so the
     primary action (RETRY / NEXT LEVEL / DIG AGAIN) is always the prominent one-tap default —
     never a forced trip back through a menu. -->
<div class="ui hidden" id="runEnd">
  <div class="big" id="reTitle"></div>
  <div class="reStars" id="reStars"></div>
  <div class="stats" id="reStats"></div>
  <div class="reBtns" id="reBtns"></div>
</div>
<script>
"use strict";
/* BONE CRUSH — daily-seeded match-3. No backend; same board worldwide per UTC day. */
const N = 8, TYPES = 8, MOVES0 = 30;   // 8 normal types (asset drop 02 added cat/cauldron/heart)
const cv = document.getElementById('game'), cx = cv.getContext('2d');
let CELL = 64, PAD = 0, TOPPAD = 56, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  const s = Math.min(innerWidth, innerHeight - 56);
  CELL = Math.floor(s / N);
  cv.width  = CELL * N * DPR; cv.height = CELL * N * DPR;
  cv.style.width = CELL*N + 'px'; cv.style.height = CELL*N + 'px';
  cv.style.marginTop = Math.max(48, (innerHeight - CELL*N) / 2) + 'px';
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (typeof autoInfo === 'function') autoInfo();
}
addEventListener('resize', ()=>{ resize(); });

function utcDayKey(){ const d = new Date(); return d.getUTCFullYear()*10000 + (d.getUTCMonth()+1)*100 + d.getUTCDate(); }
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a);
  t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
function msToReset(){ const n = new Date(); return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1) - n.getTime(); }
function adjacentDay(a, b){ if (!a) return false;
  const pa = Date.UTC(Math.floor(a/10000), Math.floor(a/100)%100-1, a%100);
  const pb = Date.UTC(Math.floor(b/10000), Math.floor(b/100)%100-1, b%100);
  return pb - pa === 86400000; }
const store = {
  get k(){ return 'bonecrush_' + utcDayKey(); },
  load(){ return { all:+localStorage.bc_all||0, today:+localStorage[this.k]||0 }; },
  save(sc){ const dk = utcDayKey();
    if (sc > (+localStorage[this.k]||0)) localStorage[this.k] = sc;
    if (sc > (+localStorage.bc_all||0)) localStorage.bc_all = sc;
    const last = +localStorage.bc_lastday||0;
    if (last !== dk){ localStorage.bc_streak = adjacentDay(last,dk) ? (+localStorage.bc_streak||0)+1 : 1;
      localStorage.bc_lastday = dk; } }
};

/* ── CAMPAIGN LEVEL TABLE ──────────────────────────────────────────────────
   Structural placeholder only — ~10 gentle levels covering all 4 objective
   types (score / clearType / drop / tiles) so the scaffold (level select,
   objective HUD, stars, unlocks, special-gating) is fully exercised end to
   end. This whole array is meant to be thrown away: every consumer reads
   LEVELS[i].{objective,target,type,count,moves,stars} generically, so
   dropping in Grok's balanced curve here is a pure data swap. */
const LEVELS = [
  // GROK CURVE DROPS IN HERE — replace this placeholder array with the tuned campaign table.
  { objective:'score',     target:600,  moves:20, stars:[600,1000,1500] },
  { objective:'clearType', type:0,      count:10, moves:20, stars:[10,16,22] },   // 0 = skull
  { objective:'drop',      count:6,     moves:22, stars:[6,10,15] },
  { objective:'score',     target:1000, moves:20, stars:[1000,1600,2300] },
  { objective:'tiles',     count:10,    moves:24, stars:[10,16,24] },
  { objective:'clearType', type:4,      count:14, moves:22, stars:[14,20,28] },   // 4 = gem
  { objective:'score',     target:1500, moves:22, stars:[1500,2300,3200] },
  { objective:'drop',      count:9,     moves:24, stars:[9,14,20] },
  { objective:'tiles',     count:16,    moves:26, stars:[16,24,34] },
  { objective:'score',     target:2200, moves:24, stars:[2200,3300,4600] },
];

/* ── PROGRESSION SAVE ── one versioned localStorage object. loadSave() always
   merges forward: any field missing from a stored save (new field added in a
   later version, or a save from before campaign existed) is filled from
   defaults rather than the whole object being discarded — progress must
   survive a schema bump, never get wiped by one. */
const SAVE_KEY = 'bc_save_v1', SAVE_VERSION = 1;
function defaultSave(){
  return { version: SAVE_VERSION, campaign: { unlocked: 1, stars: new Array(LEVELS.length).fill(0) }, endlessBest: 0 };
}
function loadSave(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){ raw = null; }
  const base = defaultSave();
  if (!raw || typeof raw !== 'object') return base;
  const merged = { ...base, ...raw, campaign: { ...base.campaign, ...(raw.campaign||{}) } };
  if (!Array.isArray(merged.campaign.stars) || merged.campaign.stars.length !== LEVELS.length){
    const old = Array.isArray(merged.campaign.stars) ? merged.campaign.stars : [];
    merged.campaign.stars = LEVELS.map((_,i)=> old[i] || 0);   // keep whatever stars line up, default rest
  }
  merged.campaign.unlocked = Math.min(Math.max(1, merged.campaign.unlocked||1), LEVELS.length);
  merged.endlessBest = +merged.endlessBest || 0;
  merged.version = SAVE_VERSION;
  return merged;
}
function persistSave(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} }
let save = loadSave();

/* audio: bone clacks + crumble */
let AC = null, muted = localStorage.bc_mute === '1', noiseBuf = null;
function ac(){ if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function beep(f,d,t,v,sl){ if (muted) return; try{ const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sl)o.frequency.exponentialRampToValueAtTime(sl,a.currentTime+d);
  g.gain.value=v||.08; g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d);}catch(e){} }
function noise(d,type,f0,f1,v,q){ if (muted) return; try{ const a=ac();
  if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);
    const b=noiseBuf.getChannelData(0); for(let i=0;i<b.length;i++)b[i]=Math.random()*2-1; }
  const s=a.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=a.createBiquadFilter(); f.type=type; f.frequency.value=f0; if(q)f.Q.value=q;
  if(f1)f.frequency.exponentialRampToValueAtTime(f1,a.currentTime+d);
  const g=a.createGain(); g.gain.value=v; g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(); s.stop(a.currentTime+d);}catch(e){} }
const sfx = {
  swap(){ beep(300,.06,'triangle',.05,380); },
  bad(){ beep(140,.15,'sawtooth',.06,90); },
  crush(n, type){ const t=Math.min(n||3,7);
    // per-piece-type clip. Gem (4) = glass shatter with BOTH clips mixed; all others random-pick.
    const real = (type === 4)
      ? playLayer(['bottle','glass'])                                          // gem → mixed glass shatter (Eric reversal)
      : playRand((type !== undefined && PIECE_SFX[type]) || ['bonecrack','bonesnap']);
    noise(.05,'bandpass',2500+Math.random()*400,900,real?.14:.36,7); // dry snap (quieter if layered on real clip)
    noise(.13,'bandpass',680,170,real?.10:.26,3);              // splintering crunch
    noise(.20,'lowpass',250,55,(real?.06:.15)+t*.02);          // low structural thud (scales w/ match size)
    if(n>=4 && !real) setTimeout(()=>noise(.05,'bandpass',2000+Math.random()*300,700,.24,6),34); }, // 2nd crack on big breaks
  chain(c){ [660,830,990].slice(0,Math.min(3,c)).forEach((f,i)=>setTimeout(()=>beep(f,.12,'sine',.09),i*70)); },
  over(){ playClip('laugh'); noise(.8,'lowpass',900,80,.4); beep(90,.7,'sine',.2,30); }
};
// Drop-in audio bank (sounds/, all loudnorm-normalized mp3). If a file is absent (onerror flag),
// we silently fall back to the synth SFX above — no 404 spam, guarded exactly like the SPRITES loader.
function loadClip(file, vol){ const a = new Audio('sounds/' + file); a.preload = 'auto'; a.volume = vol;
  a.onerror = () => { a._failed = true; }; return a; }
const CLIPS = {
  laugh:       loadClip('evil_laugh.mp3', .6),
  bonecrack:   loadClip('bone-crack.mp3', .55),   bonesnap:  loadClip('bone-snap.mp3', .55),
  bottle:      loadClip('bottle-shatter.mp3', .5), glass:    loadClip('glass-breaking.mp3', .5),
  meow:        loadClip('cat-meowing.mp3', .5),
  cauldron:    loadClip('cauldron-bubbling.mp3', .55),
  coins:       loadClip('clinking-coins.mp3', .6),
  elexpl:      loadClip('electric-explosive.mp3', .45), expl05: loadClip('explosion-05.mp3', .45),
  expl:        loadClip('explosion.mp3', .45),   elec46:    loadClip('electric46.mp3', .4),
  magic:       loadClip('magic-spell.mp3', .45),
  knife:       loadClip('knife-stab.mp3', .55),
  woodendoll:  loadClip('wooden-doll.mp3', .55),
  howl:        loadClip('wolf-howl.mp3', .5),
  angel:       loadClip('angelical-synth.mp3', .5),

/* Shared board generator — same no-pre-existing-match rule for every mode.

function makeBoard(seed){
  const r = mulberry32(seed);
  const g = [];
  for (let y = 0; y < N; y++){ g.push([]);
    for (let x = 0; x < N; x++){
      let t;
      do { t = Math.floor(r()*TYPES); }
      while ((x >= 2 && g[y][x-1] === t && g[y][x-2] === t) ||
             (y >= 2 && g[y-1][x] === t && g[y-2][x] === t));

    const t = g[y][x]; if (t < 0 || t >= SP_BASE) continue;   // specials never match by color
    if (x <= N-3 && g[y][x+1] === t && g[y][x+2] === t){ let k = x; while (k < N && g[y][k] === t){ m.add(y*N+k); k++; } }
    if (y <= N-3 && g[y+1][x] === t && g[y+2][x] === t){ let k = y; while (k < N && g[k][x] === t){ m.add(k*N+x); k++; } }
  }

}

      [g[y][x], g[y2][x2]] = [g[y2][x2], g[y][x]];
      const ok = findMatches(g).size > 0;

/* ── CAMPAIGN OBJECTIVE TRACKING ── call at every cell-clear site (normal

   nulled. No-op outside campaign. 'score' objectives need nothing here —
   they just read `score` directly in isCampaignObjectiveMet(). */
function registerClear(x, y, type){
  if (MODE !== 'campaign' || !campaignState) return;
  const lvl = LEVELS[campaignLevelIdx];
  if (lvl.objective === 'clearType' && type === lvl.type) campaignState.progress++;
  else if (lvl.objective === 'drop' && y === N-1) campaignState.progress++;
  else if (lvl.objective === 'tiles' && campaignState.crypt && campaignState.crypt[y][x]){

async function resolveBoard(chain){

    if (!anyMovePossible(grid)){ showToast('☠ No moves left — bones reshuffle'); grid = rngBoard(); }
    busy = false; handleRunEndChecks(); return;
  }
  let baseGain = 0;
  for (const i of m){ const x = i%N, y = (i-x)/N; baseGain += PIECE_VALUES[grid[y][x]] || 10; }
  const gain = baseGain * chain;
  score += gain; hudDraw();
  // dominant piece type in the match drives which clip plays (skulls crack, cats meow, hearts squish…)
  const tCnt = {};
  for (const i of m){ const tt = grid[(i-(i%N))/N][i%N]; if (tt >= 0 && tt < SP_BASE) tCnt[tt] = (tCnt[tt]||0)+1; }
  const domType = +Object.keys(tCnt).sort((a,b)=>tCnt[b]-tCnt[a])[0];
  sfx.crush(m.size, domType); if (chain > 1) sfx.chain(chain);
  const bigChain = chain >= 3 || m.size >= 5;   // reward big plays with a special seed
  if (bigChain) playRand(EXPLO_SFX);            // loud explosive layer stacked on big chains
  else playSmallExplosion();                    // small quiet explosion on every normal match (gated: not on big chains)
  let seedCell = null, cxSum = 0, cySum = 0;
  for (const i of m){ const x = i%N, y = (i-x)/N;
    burst(x*CELL + CELL/2, y*CELL + CELL/2, COLS[grid[y][x]] || '#e8dcc2', 1);
    registerClear(x, y, grid[y][x]); grid[y][x] = -1;
    cxSum += x; cySum += y;
    if (bigChain && !seedCell) seedCell = {x, y};
  }
  // score flyer at the centre of the crushed match — pops, then streams to the counter (which ticks up on arrival)
  const popPow = Math.min(3, 1 + (chain-1)*.5 + (m.size-3)*.2);
  addScoreFly((cxSum/m.size)*CELL + CELL/2, (cySum/m.size)*CELL + CELL/2, gain, popPow,
         chain >= 3 ? '#ff9a2a' : chain === 2 ? '#ffd24a' : '#f6ecd7');
  await sleep(220);
  // gravity + refill (deterministic per day+score); occasionally seed a rare special power piece
  const r = mulberry32((utcDayKey()^0xFA11) + score);
  for (let x = 0; x < N; x++){
    let write = N-1;
    for (let y = N-1; y >= 0; y--) if (grid[y][x] >= 0) grid[write--][x] = grid[y][x];
    for (let y = write; y >= 0; y--)
      grid[y][x] = (r() < 0.045) ? (SP_BASE + randomSpecialIndex(r))   // ~4.5% special
                                 : Math.floor(r()*TYPES);
  }
  // guarantee a special drop after a big chain so power plays feel rewarded
  if (bigChain && seedCell){ let done = false;
    for (let y = 0; y < N && !done; y++) for (let x = 0; x < N && !done; x++)
      if (!isSpecial(grid[y][x])){ grid[y][x] = SP_BASE + randomSpecialIndex(r); done = true; } }
  await sleep(160);
  resolveBoard(chain + 1);
}
/* ── SPECIAL POWER PIECES ──────────────────────────────────────────────────
   Fired when the player swaps a special into a neighbor. Each ability marks a
   set of cells for clearing, detonates a big explosion + evil laugh, then hands
   back to gravity/resolve. Robust: abilities only ever set cells to -1, never
   corrupt the grid, so the base match-3 keeps working. */
function px(x){ return x*CELL + CELL/2; }
function fireSpecial(sx, sy){
  const idx = specialIdx(grid[sy][sx]), def = SPECIAL_DEFS[idx];
  const clear = new Set(); const mark = (x,y) => { if (x>=0&&x<N&&y>=0&&y<N) clear.add(y*N+x); };
  let bonus = 0, stages = null;
  if (def.id === 'potion'){                       // 3×3 area blast
    for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) mark(sx+dx, sy+dy);
  } else if (def.id === 'key'){                    // handled as the staged voodoo ritual below
  } else if (def.id === 'hand'){                   // four vertical claw passes: visible columns 1, 3, 5, 7
    const cols = [0, 2, 4, 6].map(x => Math.min(N-1, x));
    stages = cols.map(x => { const cells = []; for (let y=0; y<N; y++){ mark(x,y); cells.push(y*N+x); } return cells; });
  } else if (def.id === 'eyeball'){                // color bomb: all of one random normal type
    const target = Math.floor(Math.random()*TYPES);
    for (let y=0; y<N; y++) for (let x=0; x<N; x++) if (grid[y][x] === target) mark(x, y);
    mark(sx, sy);
  } else if (def.id === 'coin'){                   // score burst + brief multiplier
    for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) mark(sx+dx, sy+dy);
    bonus = 500;
  } else if (def.id === 'megabone'){               // two-row horizontal sweep only
    const sy2 = Math.min(N-1, sy+1);
    for (let k=0; k<N; k++){ mark(k, sy); mark(k, sy2); }
    bonus = 250;
  } else if (def.id === 'knife'){                  // X slash: both diagonals through the cell
    for (let k=-N; k<=N; k++){ mark(sx+k, sy+k); mark(sx+k, sy-k); }
    bonus = 150;
  } else if (def.id === 'moon'){                   // lunar purge: clears ALL of the most common normal type
    const cnt = new Array(TYPES).fill(0);
    for (let y=0; y<N; y++) for (let x=0; x<N; x++) if (grid[y][x] >= 0 && !isSpecial(grid[y][x])) cnt[grid[y][x]]++;
    const target = cnt.indexOf(Math.max(...cnt));
    for (let y=0; y<N; y++) for (let x=0; x<N; x++) if (grid[y][x] === target) mark(x, y);
    bonus = 200;
  } else if (def.id === 'cross'){                  // holy cross: full row + full column (a BOLD plus), not a 5×5
    for (let k=0; k<N; k++){ mark(k, sy); mark(sx, k); }
    for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) mark(sx+dx, sy+dy);   // thick center → reads as a bold cross
    bonus = 200;
  } else if (def.id === 'fingerjar'){              // four corners, then the centre, one glass blast at a time
    const targets = [[0,0],[N-1,0],[N-1,N-1],[0,N-1],[Math.floor(N/2),Math.floor(N/2)]];
    stages = targets.map(([x,y]) => { mark(x,y); return [y*N+x]; });
    bonus = 100;
  } else if (def.id === 'ripple'){                 // board ripple: big diamond + chain-detonates EVERY special
    for (let y=0; y<N; y++) for (let x=0; x<N; x++)
      if (Math.abs(x-sx) + Math.abs(y-sy) <= 3 || isSpecial(grid[y][x])) mark(x, y);
    bonus = 400;
  }
  if (def.id !== 'hand') mark(sx, sy);   // Hand is intentionally limited to its four staged rows.
  return { clear, bonus, def, stages };
}
function randomBoardCells(count, predicate=()=>true){
  const pool=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(predicate(grid[y][x],x,y)) pool.push(y*N+x);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0, Math.min(count,pool.length));
}
async function detonateVoodoo(sx, sy, def){
  const moveSix = async () => {
    // Six ordinary relics rotate among six random locations, rather than merely swapping two pairs.
    const cells = randomBoardCells(6, t => t >= 0 && !isSpecial(t));
    const values = cells.map(i => grid[(i-i%N)/N][i%N]);
    values.unshift(values.pop());
    for (let i=0; i<cells.length; i++){
      const at=cells[i], x=at%N, y=(at-x)/N; grid[y][x]=values[i];
      burst(px(x),px(y),def.glow,1); await sleep(55);
    }
  };
  // Consume the doll before any movement so it can never be relocated and reused.
  registerClear(sx, sy, grid[sy][sx]); grid[sy][sx] = -1; burst(px(sx),px(sy),def.glow,3);
  playClip('laugh'); playRand(SPECIAL_SFX.key); await moveSix();
  const victims = randomBoardCells(6, t => t >= 0 && !isSpecial(t)), gain = victims.length * 12 + 150;
  score += gain; hudDraw(); addScoreFly(px(sx),px(sy),gain,2.5,def.glow);
  for (const i of victims){ const x=i%N,y=(i-x)/N; burst(px(x),px(y),def.glow,2); registerClear(x,y,grid[y][x]); grid[y][x]=-1; playRand(EXPLO_SFX); await sleep(105); }
  await moveSix();
  showToast('✦ VOODOO — move 6 · detonate 6 · move 6');
  await sleep(160);
  const r = mulberry32((utcDayKey()^0xFA11) + score);
  for (let x=0; x<N; x++){
    let write=N-1; for(let y=N-1;y>=0;y--) if(grid[y][x]>=0) grid[write--][x]=grid[y][x];
    for(let y=write;y>=0;y--) grid[y][x]=Math.floor(r()*TYPES);
  }
  await sleep(160); resolveBoard(2);
}
async function detonateSpecial(sx, sy){
  const { clear, bonus, def, stages } = fireSpecial(sx, sy);
  if (def.id === 'key') return detonateVoodoo(sx, sy, def);
  playClip('laugh');
  playRand(EXPLO_SFX);                     // a random explosive layer on top of every detonation
  sfx.crush(6); sfx.chain(2);
  const gain = clear.size * 12 + bonus;
  score += gain; hudDraw();
  // extra-big explosion centred on the special, plus a burst on every cleared cell
  const mega = def.id === 'megabone' || def.id === 'ripple';   // new heavy-hitters blow up BIGGER
  burst(px(sx), px(sy), def.glow, mega ? 5 : 3);
  addScoreFly(px(sx), px(sy), gain, mega ? 3 : 2.2, def.glow);
  // special-specific VFX + voices
  if (def.id === 'knife'){
    // DOUBLE diagonal slash: slash 1 (TL→BR) now, slash 2 (TR→BL) shortly after — each with its own
    // flash streak AND a knife-stab, so the stab sound fires TWICE, timed to each slash.
    spawnSlash(px(sx), px(sy), Math.SQRT1_2, Math.SQRT1_2, '#fff2d8'); playClip('knife');
    setTimeout(()=>{ spawnSlash(px(sx), px(sy), Math.SQRT1_2, -Math.SQRT1_2, '#fff2d8'); playClip('knife'); }, 190);
  } else if (def.id === 'cross'){
    spawnAngelWings(px(sx), px(sy));       // glowing angel wings spread from the cross centre
    playClip('angel');                     // keep the angelical-synth voice
  } else if (def.id !== 'fingerjar') {
    playRand(SPECIAL_SFX[def.id] || null); // the special's own voice (howl, shatter, coins…)
  }
  const clearCell = i => { const x = i%N, y = (i-x)/N;
    const sp2 = isSpecial(grid[y][x]);
    const c = sp2 ? def.glow : (COLS[grid[y][x]] || def.glow);
    burst(px(x), px(y), c, sp2 ? 2 : 1); registerClear(x, y, grid[y][x]); grid[y][x] = -1; };
  if (stages){
    if (def.id === 'hand'){
      // All four bone hands scrape down together, matching the knife's simultaneous impact style.
      for (const stage of stages){
        for (const i of stage) clearCell(i);
        spawnSlash(px(stage[0]%N), px(sy), 0, 1, def.glow);
      }
      await sleep(120);
    } else for (const stage of stages){
      for (const i of stage) clearCell(i);
      if (def.id === 'fingerjar') playRand(SPECIAL_SFX.fingerjar);
      await sleep(120);
    }
    for (const i of clear) if (grid[(i-i%N)/N][i%N] >= 0) clearCell(i);
  } else for (const i of clear) clearCell(i);
  showToast('✦ ' + def.id.toUpperCase() + ' — ' + def.label);
  await sleep(240);
  const r = mulberry32((utcDayKey()^0xFA11) + score);
  for (let x = 0; x < N; x++){
    let write = N-1;
    for (let y = N-1; y >= 0; y--) if (grid[y][x] >= 0) grid[write--][x] = grid[y][x];
    for (let y = write; y >= 0; y--)
      grid[y][x] = (r() < 0.045) ? (SP_BASE + randomSpecialIndex(r)) : Math.floor(r()*TYPES);
  }
  await sleep(160);
  resolveBoard(2);   // cascade any matches the blast created
}
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

/* ── MODE OUTCOME LOGIC ── single choke point, called every time a cascade
   fully settles (the `m.size === 0` base case in resolveBoard, reached after
   every player move whether it started as a plain swap or a special
   detonation). Each mode branches independently; daily's branch is byte-for-
   byte the original `if (moves <= 0) gameOver();` check. */
function handleRunEndChecks(){
  if (MODE === 'daily'){ if (moves <= 0) gameOver(); return; }
  if (MODE === 'endless'){ checkEndlessRamp(); if (moves <= 0) endlessGameOver(); return; }
  if (MODE === 'campaign'){
    if (isCampaignObjectiveMet()) campaignLevelWon();
    else if (moves <= 0) campaignLevelLost();
  }
}
/* Endless ramp: crossing the rolling score target refills moves and raises the bar. A `while` (not
   `if`) so one huge chain that leaps several tiers at once still credits every tier crossed. */
function checkEndlessRamp(){
  let tiersUp = 0;
  while (score >= endlessTarget){
    endlessTier++; tiersUp++;
    moves += ENDLESS_REFILL_MOVES;
    endlessTarget = Math.floor(endlessTarget * ENDLESS_TARGET_GROWTH);
  }
  if (tiersUp > 0){ hudDraw(); showToast(`⛏ +${tiersUp*ENDLESS_REFILL_MOVES} moves — Tier ${endlessTier+1}`); }
}
function endlessGameOver(){
  playing = false; scoreTarget = score; flyers.length = 0;
  try { PSDK.stop(); } catch(e){}
  sfx.over();
  if (score > save.endlessBest){ save.endlessBest = score; persistSave(); }
  setTimeout(()=> showRunEnd({ kind:'endless', score, best: save.endlessBest }), 700);
}
/* Campaign: 'score' reads `score` directly; the other three objective types are tallied by
   registerClear() into campaignState.progress as the board resolves. */
function isCampaignObjectiveMet(){
  const lvl = LEVELS[campaignLevelIdx];
  if (lvl.objective === 'score') return score >= lvl.target;
  return campaignState && campaignState.progress >= lvl.count;
}
/* Any win banks at least 1 star; the `stars` thresholds in LEVELS grant 2 or 3 for a stronger score. */
function starsForScore(lvl, sc){ const [s1,s2,s3] = lvl.stars; return sc >= s3 ? 3 : sc >= s2 ? 2 : 1; }
function campaignLevelWon(){
  playing = false; scoreTarget = score; flyers.length = 0;
  try { PSDK.stop(); } catch(e){}
  playClip('angel'); sfx.chain(3);
  const lvl = LEVELS[campaignLevelIdx];
  const stars = starsForScore(lvl, score);
  if (stars > (save.campaign.stars[campaignLevelIdx]||0)) save.campaign.stars[campaignLevelIdx] = stars;
  if (campaignLevelIdx + 2 > save.campaign.unlocked)
    save.campaign.unlocked = Math.min(LEVELS.length, campaignLevelIdx + 2);
  persistSave();
  setTimeout(()=> showRunEnd({ kind:'campaign', won:true, score, stars, levelIdx: campaignLevelIdx }), 700);
}
function campaignLevelLost(){
  playing = false; scoreTarget = score; flyers.length = 0;
  try { PSDK.stop(); } catch(e){}
  sfx.over();
  setTimeout(()=> showRunEnd({ kind:'campaign', won:false, score, levelIdx: campaignLevelIdx }), 700);
}
/* Frontier level for cold-open / resume: the first unlocked level not yet CLEARED (0 stars) —
   a level a player already beat (even with only 1-2 stars) is done, so resuming should never
   bounce them back into a level they've already passed. Once every unlocked level is cleared,
   resume at the most-recently-unlocked one (the newest challenge available). */
function campaignFrontierLevel(){
  for (let i = 0; i < save.campaign.unlocked; i++) if ((save.campaign.stars[i]||0) === 0) return i;
  return Math.min(save.campaign.unlocked - 1, LEVELS.length - 1);
}
/* Deterministic-per-attempt board + crypt-tile overlay for a campaign level. Retrying reshuffles
   (attempt increments the seed) rather than replaying byte-identical boards forever. */
function campaignBoard(idx, attempt){ return makeBoard(((idx*7919 + attempt*104729 + 1) >>> 0)); }
function initCampaignState(idx, attempt){
  const lvl = LEVELS[idx];
  const state = { progress: 0, crypt: null };
  if (lvl.objective === 'tiles'){
    const r = mulberry32((idx*104729 + attempt*131 + 17) >>> 0);
    const coords = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) coords.push([x,y]);
    for (let i = coords.length-1; i > 0; i--){ const j = Math.floor(r()*(i+1)); [coords[i],coords[j]]=[coords[j],coords[i]]; }
    state.crypt = Array.from({length:N}, ()=> new Array(N).fill(false));
    // seed extra tiles beyond the target count so a run of bad luck can't make the level unwinnable
    const seedCount = Math.min(lvl.count + Math.ceil(lvl.count*0.6), N*N);
    for (let i = 0; i < seedCount; i++){ const [x,y] = coords[i]; state.crypt[y][x] = true; }
  }
  return state;
}

/* input: click/drag two adjacent cells */
function cellAt(e){
  const r = cv.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  const x = Math.floor((p.clientX - r.left) / CELL), y = Math.floor((p.clientY - r.top) / CELL);
  return (x >= 0 && x < N && y >= 0 && y < N) ? {x, y} : null;
}
/* swap-attempt log for the F8 bug reporter (last 5 attempts, newest last) */
const swapLog = [];
function logSwap(a, b, accepted, reason, fromPiece, toPiece){
  swapLog.push({ from:{...a}, to:{...b}, fromPiece, toPiece,
    accepted, reason, score, moves, t: Date.now() });
  if (swapLog.length > 5) swapLog.shift();
}
function pieceName(t){ if (t === undefined) return '?'; if (t < 0) return 'empty';
  return isSpecial(t) ? 'SPECIAL:' + SPECIAL_DEFS[specialIdx(t)].id
       : ['skull','crossbones','ribcage','femur','gem','blackcat','cauldron','heart'][t] || String(t); }
async function trySwap(a, b){
  const pa = pieceName(grid[a.y] && grid[a.y][a.x]), pb = pieceName(grid[b.y] && grid[b.y][b.x]);
  if (busy || Math.abs(a.x-b.x) + Math.abs(a.y-b.y) !== 1) {
    logSwap(a, b, false, busy ? 'busy (board resolving)' : 'not adjacent', pa, pb); sel = null; return; }
  busy = true; sel = null;
  // Special power piece: swapping it into a neighbor fires its ability (no color match needed).
  const aSp = isSpecial(grid[a.y][a.x]), bSp = isSpecial(grid[b.y][b.x]);
  if (aSp || bSp){
    logSwap(a, b, true, 'special detonation', pa, pb);
    sfx.swap(); moves--; hudDraw();
    const s = aSp ? a : b;                 // detonate at the special's cell
    await detonateSpecial(s.x, s.y);
    return;
  }
  [grid[a.y][a.x], grid[b.y][b.x]] = [grid[b.y][b.x], grid[a.y][a.x]];
  sfx.swap();
  await sleep(120);
  if (findMatches(grid).size === 0){
    [grid[a.y][a.x], grid[b.y][b.x]] = [grid[b.y][b.x], grid[a.y][a.x]];
    logSwap(a, b, false, 'no match formed', pa, pb);
    sfx.bad(); busy = false; return;
  }
  logSwap(a, b, true, 'match', pa, pb);
  moves--; hudDraw();
  resolveBoard(1);
}
/* ── BUG REPORTER (F8 or 🐞) — downloads a JSON snapshot Eric can send back ── */
function bugReport(){
  let note = '';
  try { note = prompt('🐞 Bug report — what went wrong? (optional)') || ''; } catch(e){}
  const board = grid.map(row => row.map(t => t < 0 ? 'empty' : pieceName(t)));
  const data = { when: new Date().toISOString(), note, score, moves, playing, busy,
                 dayKey: utcDayKey(), board, lastSwaps: swapLog.slice() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bonecrush_report_' + Date.now() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  showToast('🐞 Report downloaded');
}
addEventListener('keydown', e => { if (e.key === 'F8'){ e.preventDefault(); bugReport(); } });
let dragStart = null;
cv.addEventListener('pointerdown', e => { if (!playing || busy) return;
  const c = cellAt(e); if (!c) return;
  if (sel && (Math.abs(sel.x-c.x)+Math.abs(sel.y-c.y) === 1)){ trySwap(sel, c); }
  else { sel = c; dragStart = c; }
});
cv.addEventListener('pointermove', e => { if (!playing || busy || !dragStart) return;
  const c = cellAt(e); if (!c || (c.x === dragStart.x && c.y === dragStart.y)) return;
  const dx = c.x - dragStart.x, dy = c.y - dragStart.y;
  const step = Math.abs(dx) > Math.abs(dy) ? {x:dragStart.x+Math.sign(dx), y:dragStart.y} : {x:dragStart.x, y:dragStart.y+Math.sign(dy)};
  trySwap(dragStart, step); dragStart = null;
});
cv.addEventListener('pointerup', ()=>{ dragStart = null; });

/* flow */
const overlay = document.getElementById('overlay'), btnGo = document.getElementById('btnGo'),
      btnShare = document.getElementById('btnShare'), hud = document.getElementById('hud'),
      movesEl = document.getElementById('moves'), toast = document.getElementById('toast'),
      scoreLine = document.getElementById('scoreLine'), resultBlock = document.getElementById('resultBlock'),
      dailyEl = document.getElementById('daily');
function hudDraw(){
  movesEl.textContent = '⛏ ' + moves;   // score readout is animated in render() via tickScore()
  if (MODE === 'campaign' && campaignState){
    const lvl = LEVELS[campaignLevelIdx];
    const txt = lvl.objective === 'score' ? `${score}/${lvl.target}`
      : lvl.objective === 'clearType' ? `${PIECE_NAMES[lvl.type]} ${campaignState.progress}/${lvl.count}`
      : lvl.objective === 'drop' ? `Drop ${campaignState.progress}/${lvl.count}`
      : `Tiles ${campaignState.progress}/${lvl.count}`;
    objHud.textContent = `🎯 Lv.${campaignLevelIdx+1} · ${txt}`;
    objHud.classList.remove('hidden');
  } else if (MODE === 'endless'){
    objHud.textContent = `♾️ Tier ${endlessTier+1} · next ${endlessTarget}`;
    objHud.classList.remove('hidden');
  } else {
    objHud.classList.add('hidden');
  }
}
function showToast(t){ toast.textContent = t; toast.style.opacity = 1; setTimeout(()=>toast.style.opacity = 0, 2000); }
function fmtReset(){ const ms = msToReset(); return `New board in ${Math.floor(ms/3.6e6)}h ${Math.floor(ms%3.6e6/6e4)}m`; }
function refreshMenu(done){
  const st = store.load();
  document.getElementById('stBest').textContent = st.today;
  document.getElementById('stAll').textContent = st.all;
  document.getElementById('stStreak').textContent = (localStorage.bc_streak||0) + '🔥';
  dailyEl.textContent = fmtReset();
  if (done){
    resultBlock.classList.remove('hidden'); btnShare.classList.remove('hidden');
    const isBest = score >= st.today && score > 0;
    scoreLine.innerHTML = `You crushed <span style="color:#fff;font-size:1.3em">${score}</span>` +
      (isBest ? " — 🏆 today's best!" : ` · today's best ${st.today}`);
    btnGo.textContent = 'DIG AGAIN';
  }
}
let runs = 0;
/* start() branches on MODE for grid/moves/objective setup, then hides every overlay-like screen
   (only one is ever relevant at a time, but clearing them all is cheap and avoids stacking bugs). */
function start(){
  try { const a = ac(); a && a.resume && a.resume(); } catch(e){}
  if (MODE === 'daily') grid = rngBoard();                                        // unchanged daily board
  else if (MODE === 'endless'){ grid = makeBoard((Date.now() ^ 0xE0D1E55) >>> 0); endlessTier = 0; endlessTarget = ENDLESS_START_TARGET; }
  else { grid = campaignBoard(campaignLevelIdx, campaignAttempt); campaignState = initCampaignState(campaignLevelIdx, campaignAttempt); }
  score = 0; moves = (MODE === 'campaign') ? LEVELS[campaignLevelIdx].moves : MOVES0;
  sel = null; busy = false; playing = true;
  scoreShown = 0; scoreTarget = 0; hudPulse = 0; hudFlash = 0;
  flyers.length = 0; wings.length = 0; slashes.length = 0; pops.length = 0;
  [overlay, modeSelect, levelSelect, runEnd].forEach(el => el.classList.add('hidden'));
  hudDraw();
  runs++;
  try { PSDK.start(); } catch(e){}          // gameplayStart on every mode's run start
}
function gameOver(){   // DAILY only — reached via handleRunEndChecks(), body unchanged from the original
  playing = false; scoreTarget = score; flyers.length = 0;   // bank any in-flight points onto the final total
  try { PSDK.stop(); } catch(e){}           // gameplayStop on game over (death screen)
  sfx.over(); store.save(score);
  setTimeout(()=>{ overlay.classList.remove('hidden'); refreshMenu(true); }, 700);
}
/* Shared "begin a run" gate for every mode. First run of the session: straight into the game
   (no ad — critical for the cold-open, see resumeMode()). Every later run is a natural break →
   request a midgame ad, muting audio while it plays, then start once it finishes/errors regardless. */
let adBusy = false;
function beginGame(){
  if (adBusy) return;
  if (runs > 0){
    adBusy = true;
    const wasMuted = muted; muted = true;   // silence SFX for the duration of the ad
    PSDK.midgame().catch(()=>{}).then(()=>{ muted = wasMuted; adBusy = false; start(); });
  } else start();
}
['click','touchend'].forEach(ev => btnGo.addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); beginGame(); }));
btnShare.onclick = async e => { e.stopPropagation();
  const txt = `💀 I crushed ${score} on today's Bone Crush board — everyone digs the SAME catacomb today. Beat me: ${location.href.split('?')[0]}`;
  try { if (navigator.share) await navigator.share({ text: txt });
        else { await navigator.clipboard.writeText(txt); showToast('Challenge copied'); } } catch(err){}
};

/* ── MODE PANEL, LEVEL SELECT, RUN-END ──────────────────────────────────────
   Cold-open correction: the game must never show a menu/splash before the first swap, so none of
   these screens appear on load. The 🏠 corner button is the ONLY way to reach the mode panel;
   level select and run-end are reached from there or from natural play (level cleared/failed). */
const modeSelect = document.getElementById('modeSelect'), levelSelect = document.getElementById('levelSelect'),
      runEnd = document.getElementById('runEnd'), menuBtn = document.getElementById('menuBtn'),
      objHud = document.getElementById('objHud'), btnResume = document.getElementById('btnResume');
/* Dual click+touchend binding (matching btnGo's existing pattern) keeps every new control tap-
   responsive with no 300ms delay and no double-fire on touch devices. */
function bindTap(el, fn){ ['click','touchend'].forEach(ev => el.addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); fn(e); })); }
function openModePanel(){
  const wasPlaying = playing;
  playing = false;
  [overlay, levelSelect, runEnd].forEach(el => el.classList.add('hidden'));
  btnResume.classList.toggle('hidden', !wasPlaying);
  modeSelect.classList.remove('hidden');
}
bindTap(menuBtn, openModePanel);
bindTap(btnResume, ()=>{ modeSelect.classList.add('hidden'); playing = true; });
bindTap(document.getElementById('btnCampaign'), ()=>{ modeSelect.classList.add('hidden'); showLevelSelect(); });
bindTap(document.getElementById('btnEndless'), ()=>{ modeSelect.classList.add('hidden'); MODE = 'endless'; beginGame(); });
bindTap(document.getElementById('btnDaily'), ()=>{ modeSelect.classList.add('hidden'); MODE = 'daily'; beginGame(); });
bindTap(document.getElementById('lsBack'), ()=>{ levelSelect.classList.add('hidden'); modeSelect.classList.remove('hidden'); });
function showLevelSelect(){
  levelSelect.classList.remove('hidden');
  let h = '';
  for (let i = 0; i < LEVELS.length; i++){
    const unlocked = i < save.campaign.unlocked, stars = save.campaign.stars[i]||0;
    const starStr = unlocked ? ('★★★'.slice(0,stars) + '☆☆☆'.slice(0, 3-stars)) : '🔒';
    h += `<button class="lsCell${unlocked?'':' locked'}" data-i="${i}"${unlocked?'':' disabled'}>` +
         `<span class="lsNum">${i+1}</span><span class="lsStars">${starStr}</span></button>`;
  }
  const lsGrid = document.getElementById('lsGrid');

  lsGrid.querySelectorAll('.lsCell').forEach(btn => { if (btn.disabled) return;
    bindTap(btn, ()=>{ campaignLevelIdx = +btn.dataset.i; campaignAttempt = 0; MODE = 'campaign';
      levelSelect.classList.add('hidden'); beginGame(); }); });

/* Builds the win/lose/endless-out popup. RETRY / NEXT LEVEL / DIG AGAIN is always the first,
   prominent (.go) button — the player is never forced back through a menu to keep playing. */
function showRunEnd(o){
  runEnd.classList.remove('hidden');
  const reTitle = document.getElementById('reTitle'), reStats = document.getElementById('reStats'),
        reStars = document.getElementById('reStars'), reBtns = document.getElementById('reBtns');
  reStars.textContent = '';
  if (o.kind === 'endless'){

    reStats.innerHTML = `<div class="stat"><div class="v">${o.score}</div><div class="l">Score</div></div>` +
                         `<div class="stat"><div class="v">${o.best}</div><div class="l">Best</div></div>`;
    reBtns.innerHTML = `<button class="go" id="reRetry">DIG AGAIN</button><button class="back" id="reMenu">‹ Menu</button>`;
    bindTap(document.getElementById('reRetry'), ()=>{ runEnd.classList.add('hidden'); beginGame(); });
    bindTap(document.getElementById('reMenu'), ()=>{ runEnd.classList.add('hidden'); openModePanel(); });
  } else if (o.kind === 'campaign' && o.won){
    reTitle.textContent = `⚱️ Level ${o.levelIdx+1} cleared!`;
    reStars.textContent = '★★★'.slice(0,o.stars) + '☆☆☆'.slice(0, 3-o.stars);
    reStats.innerHTML = `<div class="stat"><div class="v">${o.score}</div><div class="l">Score</div></div>`;
    const hasNext = o.levelIdx+1 < LEVELS.length;
    reBtns.innerHTML = (hasNext ? `<button class="go" id="reNext">NEXT LEVEL</button>` : '') +
      `<button class="back" id="reRetry2">Replay</button><button class="back" id="reMenu">‹ Levels</button>`;
    if (hasNext) bindTap(document.getElementById('reNext'), ()=>{ campaignLevelIdx++; campaignAttempt = 0; runEnd.classList.add('hidden'); beginGame(); });
    bindTap(document.getElementById('reRetry2'), ()=>{ campaignAttempt++; runEnd.classList.add('hidden'); beginGame(); });
    bindTap(document.getElementById('reMenu'), ()=>{ runEnd.classList.add('hidden'); showLevelSelect(); });

/* Cold-open: called once at load (see the bottom of this script). Always campaign, at the
   frontier level, and calls start() directly (never beginGame()) so the very first paint is a
   live, playable board with zero clicks and no ad gate. */
function resumeMode(){
  MODE = 'campaign'; campaignAttempt = 0; campaignLevelIdx = campaignFrontierLevel();
  start();
}

/* Animated score counter: roll `scoreShown` up toward `scoreTarget`, with a scale-pop + colour flash.
   Driven every frame so the number visibly climbs as flyers land. */
function tickScore(dt){
  scoreShown += (scoreTarget - scoreShown) * Math.min(1, dt*9);
  if (Math.abs(scoreTarget - scoreShown) < 0.6) scoreShown = scoreTarget;
  hudPulse = Math.max(0, hudPulse - dt*3.0);
  hudFlash = Math.max(0, hudFlash - dt*2.4);
  hud.textContent = '💀 ' + Math.round(scoreShown);
  hud.style.transform = 'scale(' + (1 + hudPulse*0.30).toFixed(3) + ')';
  if (hudFlash > 0){ const f = hudFlash;
    hud.style.color = '#fff';
    hud.style.textShadow = `0 0 ${(12+f*34).toFixed(0)}px #ffe27a, 0 0 ${(26+f*54).toFixed(0)}px #ff8a00, 0 0 42px #c93400`;
  } else { hud.style.color = ''; hud.style.textShadow = ''; }
}
/* render */
function render(t){
  requestAnimationFrame(render);
  const dt = Math.min(.05, (t - t0)/1000 || .016); t0 = t;
  tickScore(dt);
  const hudT = hudTargetCanvas();   // score-counter target for flyers (cached once per frame)
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.save();
  if (shake > 0){ shake = Math.max(0, shake - dt*40);
    cx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); }
  // stone cells with beveled depth
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const g = cx.createLinearGradient(x*CELL, y*CELL, x*CELL, y*CELL+CELL);
    if ((x+y) % 2){ g.addColorStop(0,'#3a2a1a'); g.addColorStop(1,'#241a10'); }
    else { g.addColorStop(0,'#463321'); g.addColorStop(1,'#2b2015'); }
    cx.fillStyle = g;
    cx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
    // dirt speckle (stable per cell)
    const sr = mulberry32(x*73 + y*131);
    cx.fillStyle = 'rgba(0,0,0,.25)';
    for (let k = 0; k < 4; k++) cx.fillRect(x*CELL + 4 + sr()*(CELL-10), y*CELL + 4 + sr()*(CELL-10), 2, 2);
    cx.fillStyle = 'rgba(255,220,160,.06)';
    cx.fillRect(x*CELL+1, y*CELL+1, CELL-2, 2);
  }
  drawCreatures(dt);   // cosmetic creatures drift behind the pieces (above the stone floor)
  if (sel){ cx.strokeStyle = '#ffcf7d'; cx.lineWidth = 3;
    cx.strokeRect(sel.x*CELL+2, sel.y*CELL+2, CELL-4, CELL-4); }
  if (grid.length)
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
      if (grid[y][x] >= 0)
        drawPiece(grid[y][x], x*CELL + CELL/2, y*CELL + CELL/2, CELL*.42,
                  sel && sel.x === x && sel.y === y ? t*.02 : 0);
  // campaign 'tiles' objective: a sealed crypt crust over each un-cleared tile cell, drawn on top
  // of the piece beneath it so it visibly needs matching-through to break.
  if (MODE === 'campaign' && campaignState && campaignState.crypt){
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (campaignState.crypt[y][x]){
      cx.save(); cx.globalAlpha = .55;
      cx.fillStyle = 'rgba(40,30,20,.55)';
      cx.fillRect(x*CELL+3, y*CELL+3, CELL-6, CELL-6);
      cx.strokeStyle = 'rgba(180,140,80,.6)'; cx.lineWidth = 2;
      cx.strokeRect(x*CELL+3, y*CELL+3, CELL-6, CELL-6);
      cx.beginPath(); cx.moveTo(x*CELL+8, y*CELL+8); cx.lineTo(x*CELL+CELL-10, y*CELL+CELL-14);
      cx.moveTo(x*CELL+CELL-10, y*CELL+10); cx.lineTo(x*CELL+10, y*CELL+CELL-8);
      cx.strokeStyle = 'rgba(20,14,10,.5)'; cx.lineWidth = 1.4; cx.stroke();
      cx.restore();
    }
  }
  // radial flash blooms — bright additive gradient burst at each cleared cell (fakes ray-traced bloom)
  for (let i = flashes.length-1; i >= 0; i--){ const f = flashes[i]; f.t += dt;
    if (f.t > f.life){ flashes.splice(i,1); continue; }
    const k = f.t / f.life, rad = f.r * (0.4 + k*1.2);
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = (1-k)*(1-k);
    const fg = cx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rad);
    fg.addColorStop(0, 'rgba(255,255,240,1)'); fg.addColorStop(.35, 'rgba(255,190,90,.7)');
    fg.addColorStop(1, 'rgba(255,120,20,0)');
    cx.fillStyle = fg; cx.beginPath(); cx.arc(f.x, f.y, rad, 0, 7); cx.fill();
    cx.restore();
  }
  // "raytrace" light beams — rotating additive rays fanning out from each crush, with a hot core flash
  for (let i = rays.length-1; i >= 0; i--){ const R = rays[i]; R.t += dt;
    if (R.t > R.life){ rays.splice(i,1); continue; }
    const k = R.t / R.life, a = (1-k)*(1-k), len = R.len * (0.35 + k*1.1);
    cx.save(); cx.globalCompositeOperation = 'lighter';
    cx.translate(R.x, R.y); cx.rotate(R.rot + R.t*R.vr);
    for (let j = 0; j < R.n; j++){
      cx.rotate(Math.PI*2 / R.n);
      const lg = cx.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, 'rgba(255,250,230,' + (a*.9).toFixed(3) + ')');
      lg.addColorStop(.5, R.col);
      lg.addColorStop(1, 'rgba(0,0,0,0)');
      cx.globalAlpha = a * .55;
      cx.fillStyle = lg;
      cx.beginPath(); cx.moveTo(0, -2.5*(1-k) - .5); cx.lineTo(len, 0); cx.lineTo(0, 2.5*(1-k) + .5);
      cx.closePath(); cx.fill();
    }
    // bright core flash on top of the rays
    cx.globalAlpha = a;
    const cg = cx.createRadialGradient(0, 0, 0, 0, 0, len*.28);
    cg.addColorStop(0, 'rgba(255,255,250,1)'); cg.addColorStop(.5, 'rgba(255,220,140,.6)');
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = cg; cx.beginPath(); cx.arc(0, 0, len*.28, 0, 7); cx.fill();
    cx.restore();
  }
  // knife slash streaks — bright tapered cut with a hot head sweeping corner-to-corner (additive)
  for (let i = slashes.length-1; i >= 0; i--){ const s = slashes[i]; s.t += dt;
    if (s.t > s.life){ slashes.splice(i,1); continue; }
    const k = s.t / s.life, a = (1-k)*(1-k);
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = a;
    const lg = cx.createLinearGradient(s.x1, s.y1, s.x2, s.y2);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, s.col); lg.addColorStop(1, 'rgba(255,255,255,0)');
    cx.strokeStyle = lg; cx.lineWidth = (1-k)*11 + 2; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(s.x1, s.y1); cx.lineTo(s.x2, s.y2); cx.stroke();
    const hx = s.x1 + (s.x2-s.x1)*k, hy = s.y1 + (s.y2-s.y1)*k;
    const cg = cx.createRadialGradient(hx, hy, 0, hx, hy, CELL*.62);
    cg.addColorStop(0, 'rgba(255,255,250,' + a.toFixed(3) + ')'); cg.addColorStop(1, 'rgba(255,220,140,0)');
    cx.fillStyle = cg; cx.beginPath(); cx.arc(hx, hy, CELL*.62, 0, 7); cx.fill();
    cx.restore();
  }
  // glowing angel wings — feathers fan up-and-outward from the cross centre, then fade (additive)
  for (let i = wings.length-1; i >= 0; i--){ const w = wings[i]; w.t += dt;
    if (w.t > w.life){ wings.splice(i,1); continue; }
    const k = w.t / w.life, spread = CELL*(0.55 + k*2.6);
    const alpha = (k < .22 ? k/.22 : 1 - (k-.22)/.78) * 0.92;
    if (alpha <= 0) continue;
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.translate(w.x, w.y); cx.globalAlpha = alpha;
    for (const side of [-1, 1]){ cx.save(); cx.scale(side, 1);
      for (let f = 0; f < 6; f++){
        const fa = -0.12 - f*0.17, fl = spread * (1 - f*0.10);
        const ex = Math.cos(fa)*fl, ey = Math.sin(fa)*fl;
        const grd = cx.createLinearGradient(0, 0, ex, ey);
        grd.addColorStop(0, 'rgba(255,250,235,' + (alpha*0.95).toFixed(3) + ')');
        grd.addColorStop(.6, 'rgba(255,224,150,' + (alpha*0.5).toFixed(3) + ')');
        grd.addColorStop(1, 'rgba(255,200,90,0)');
        cx.strokeStyle = grd; cx.lineWidth = Math.max(2, spread*0.05*(1 - f*0.1)); cx.lineCap = 'round';
        cx.beginPath(); cx.moveTo(0, 0); cx.quadraticCurveTo(ex*.5, ey*.5 - spread*0.18, ex, ey); cx.stroke();
      }
      cx.restore();
    }
    const cg = cx.createRadialGradient(0, 0, 0, 0, 0, spread*0.5);
    cg.addColorStop(0, 'rgba(255,255,245,' + (alpha*0.8).toFixed(3) + ')'); cg.addColorStop(1, 'rgba(255,220,140,0)');
    cx.fillStyle = cg; cx.beginPath(); cx.arc(0, 0, spread*0.5, 0, 7); cx.fill();
    cx.restore();
  }
  for (let i = parts.length-1; i >= 0; i--){ const p = parts[i]; p.t += dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 700*dt; p.rot += p.vr*dt;
    if (p.t > p.life){ parts.splice(i,1); continue; }
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = 1 - p.t/p.life; cx.fillStyle = p.col;
    if (p.glow){ cx.globalCompositeOperation = 'lighter'; cx.shadowColor = p.col; cx.shadowBlur = 12;
      cx.beginPath(); cx.arc(0, 0, p.w*.7, 0, 7); cx.fill(); }
    else cx.fillRect(-p.w/2, -p.w/3, p.w, p.w*0.66);
    cx.restore(); cx.globalAlpha = 1;
  }
  // fast glowing shockwave rings (additive, expand quicker + wider on bigger booms)
  for (let i = rings.length-1; i >= 0; i--){ const r = rings[i]; r.t += dt;
    if (r.t > r.life){ rings.splice(i,1); continue; }
    const k = r.t / r.life, pw = r.power || 1;
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = (1-k) * .85;
    cx.strokeStyle = k < .3 ? '#fff8d8' : '#ffb14c'; cx.lineWidth = (6*(1-k) + 1) * pw;
    cx.beginPath(); cx.arc(r.x, r.y, CELL*(.25 + k*(1.5+pw*.55)), 0, 7); cx.stroke();
    cx.restore();
  }
  // floating score popups — GROW in, drift upward, then fade out (~0.9s)
  for (let i = pops.length-1; i >= 0; i--){ const p = pops[i]; p.t += dt;
    if (p.t > p.life){ pops.splice(i,1); continue; }
    const k = p.t / p.life;
    const scale = k < .25 ? .45 + (k/.25)*.75 : 1.2 - (k-.25)*.15;         // pop up to 1.2x then settle
    const alpha = k < .6 ? 1 : (1 - (k-.6)/.4);                             // hold, then fade
    const size = Math.min(CELL*.62, CELL*.34*p.power) * scale;
    cx.save(); cx.translate(p.x, p.y - k*CELL*.95);
    cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = alpha;
    cx.font = '900 ' + Math.floor(size) + 'px "Segoe UI", system-ui, sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.shadowColor = p.col; cx.shadowBlur = 14 * p.power;
    cx.lineWidth = Math.max(2, size*.1); cx.strokeStyle = 'rgba(60,20,0,.8)';
    cx.strokeText(p.txt, 0, 0);
    cx.fillStyle = p.col; cx.fillText(p.txt, 0, 0);
    cx.shadowBlur = 0; cx.fillStyle = 'rgba(255,255,240,.85)';
    cx.fillText(p.txt, 0, -size*.02);                                       // hot white top layer
    cx.restore();
  }
  // score flyers — pop in place, then arc toward the score counter; bump the total when they land
  for (let i = flyers.length-1; i >= 0; i--){ const fl = flyers[i]; fl.t += dt;
    const total = fl.pop + fl.drop + fl.fly;
    if (fl.t >= total){ bumpScore(fl.value); flyers.splice(i,1); continue; }
    let fx, fy, scale, alpha;
    if (fl.t < fl.pop){                       // grow/pop at the explosion
      const u = fl.t / fl.pop;
      fx = fl.sx; fy = fl.sy;
      scale = 0.4 + u*0.95; alpha = 1;
    } else if (fl.t < fl.pop + fl.drop){      // a small gravity dip keeps the number readable in-place
      const u = (fl.t-fl.pop) / fl.drop;
      fx = fl.sx; fy = fl.sy + CELL*.34*u*u;
      scale = 1.35 - u*.08; alpha = 1;
    } else {                                  // arc/stream to the counter (ease-in = accelerate on arrival)
      const u = (fl.t - fl.pop - fl.drop) / fl.fly, e = u*u*u;
      const startY = fl.sy + CELL*.34, midx = (fl.sx + hudT.x)/2, ctrlY = Math.min(startY, hudT.y) - CELL*.8;
      const mt = 1 - e;
      fx = mt*mt*fl.sx + 2*mt*e*midx + e*e*hudT.x;
      fy = mt*mt*startY + 2*mt*e*ctrlY + e*e*hudT.y;
      scale = 1.35 - u*0.7; alpha = u < .75 ? 1 : (1 - (u-.75)/.25);
    }
    const size = Math.min(CELL*.6, CELL*.32*fl.power) * scale;
    cx.save(); cx.translate(fx, fy);
    cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = Math.max(0, alpha);
    cx.font = '900 ' + Math.max(8, Math.floor(size)) + 'px "Segoe UI", system-ui, sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.shadowColor = fl.col; cx.shadowBlur = 16 * fl.power;
    cx.lineWidth = Math.max(2, size*.11); cx.strokeStyle = 'rgba(60,20,0,.85)';
    cx.strokeText('+' + fl.value, 0, 0);
    cx.fillStyle = fl.col; cx.fillText('+' + fl.value, 0, 0);
    cx.shadowBlur = 0; cx.fillStyle = 'rgba(255,255,240,.9)'; cx.fillText('+' + fl.value, 0, -size*.03);
    cx.restore();
  }
  cx.restore();
  // full-board ember + white bloom flash on big crushes (chromatic pop via additive white)
  if (flash > 0){ flash = Math.max(0, flash - dt*2.4);
    cx.fillStyle = `rgba(255,150,40,${flash*.14})`;
    cx.fillRect(0, 0, cv.width, cv.height);
    cx.save(); cx.globalCompositeOperation = 'lighter';
    cx.fillStyle = `rgba(255,245,225,${flash*flash*.12})`;
    cx.fillRect(0, 0, cv.width, cv.height); cx.restore();
  }
}

/* Test/QA helper: trigger a crush sound for a given piece type (e.g. 4 = gem → glass) for sfx tracing. */
window.__testCrush = (n, t) => { sfx.crush(n || 3, t == null ? 0 : t); return 'crush ' + (n||3) + ' type ' + (t==null?0:t); };
/* Test/QA helper: force a specific special onto the board and detonate it (for on-camera verification). */
window.__forceSpecial = (id, x, y) => {
  x = (x == null) ? 3 : x; y = (y == null) ? 3 : y;
  const idx = SPECIAL_DEFS.findIndex(d => d.id === id);
  if (idx < 0 || !grid.length) return 'no such special: ' + id;
  grid[y][x] = SP_BASE + idx; busy = true; detonateSpecial(x, y);
  return 'fired ' + id + ' @ ' + x + ',' + y;
};

/* ── LEFT-SIDE INFO PANEL (ossuary legend) ── pieces + point values, powers, and the rules ── */
const infoToggle = document.getElementById('infoToggle'), infoPanel = document.getElementById('infoPanel');
const PIECE_ICONS = ['skull.png','crossbones.png','ribcage.png','femur.png','gem.png','blackcat.png','cauldron.png','heart.png'];
const PIECE_NAMES = ['Skull','Crossbones','Ribcage','Femur','Emerald gem','Black cat','Cauldron','Heart'];
const SPECIAL_INFO = {
  potion:'detonates a 3×3 square', key:'moves 6 relics, detonates 6, then moves 6 again', eyeball:'purges every relic of one random type',
  coin:'detonates 3×3 and adds a large score bonus', hand:'four bone hands scrape columns 1, 3, 5 & 7 together', megabone:'sweeps two horizontal rows',
  ripple:'diamond blast that detonates every special', knife:'two simultaneous diagonal slashes (X)',
  moon:'purges the board’s most common relic', cross:'bold row-and-column blast with angel wings',
  fingerjar:'glass-shatters all four corners, then the centre',
};
function buildInfoPanel(){
  let h = '<h3>Relics · points each</h3>';
  for (let i = 0; i < PIECE_ICONS.length; i++)
    h += `<div class="row"><img src="assets/${PIECE_ICONS[i]}" alt=""><span class="nm">${PIECE_NAMES[i]}</span><span class="pts">${PIECE_VALUES[i]}</span></div>`;
  h += '<h3>Powers</h3>';
  for (const d of SPECIAL_DEFS)
    h += `<div class="row"><img src="assets/${d.file}" alt="${d.name}"><span class="ds"><b style="color:#f4e6c4">${d.name}</b> — ${SPECIAL_INFO[d.id] || d.label}</span></div>`;
  h += '<h3>How it works</h3><ul>'
    + '<li>Swap two adjacent relics to line up <b>3+</b> of a kind.</li>'
    + '<li>Longer matches (4, 5, T, L) &amp; chain reactions <b>multiply</b> your score.</li>'
    + '<li>Each relic awards its listed points × the chain number.</li>'
    + '<li>Big plays (chain 3+, or 5+ in a line) drop a glowing <b>SPECIAL</b> relic.</li>'
    + '<li>Swap a special into any neighbor to <b>detonate</b> its power.</li>'
    + `<li>You get <b>${MOVES0} moves</b> — no moves left reshuffles the bones.</li>`
    + '<li>Everyone on Earth digs the <b>same board</b> each UTC day.</li>'
    + '</ul>';
  infoPanel.innerHTML = h;
}
buildInfoPanel();
let infoUserSet = false, infoOpen = false;
function setInfo(open){ infoOpen = open; infoPanel.classList.toggle('hidden', !open);
  infoToggle.textContent = open ? '📖' : '📕'; }
function autoInfo(){ if (infoUserSet) return; setInfo(((innerWidth - CELL*N) / 2) >= 220); }
infoToggle.onclick = e => { e.stopPropagation(); infoUserSet = true; setInfo(!infoOpen); };

let bcPilot = true;
window.__stopBot = () => { bcPilot = false; return 'bot stopped'; };   // QA: freeze the auto-player to isolate effects
if (location.search.includes('test')){
  // ?test=1 alone → daily bot (original behavior, unchanged). ?test=1&mode=endless or
  // ?test=1&mode=campaign&level=N lets QA drive the other two modes the same way.
  const testParams = new URLSearchParams(location.search);
  const testMode = testParams.get('mode');
  if (testMode === 'endless') MODE = 'endless';
  else if (testMode === 'campaign'){ MODE = 'campaign';
    campaignLevelIdx = Math.max(0, Math.min(LEVELS.length-1, (+testParams.get('level')||1)-1)); }
  else MODE = 'daily';
  ['pointerdown','keydown'].forEach(ev => addEventListener(ev, e => {
    if (e.isTrusted && bcPilot){ bcPilot = false; showToast('🎮 You have control'); } }, true));
  setTimeout(()=>{ start();
    (async function bot(){
      while (moves > 0 && bcPilot && playing){
        if (!busy){
          // prefer firing a special power piece (swap it into any neighbor) to exercise abilities
          let fired = false;
          outerSp:
          for (let y = 0; y < N && !fired; y++) for (let x = 0; x < N; x++)
            if (isSpecial(grid[y][x])){
              const nb = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:x+dx,y:y+dy}))
                          .find(c => c.x>=0&&c.x<N&&c.y>=0&&c.y<N);
              if (nb){ fired = true; await trySwap({x,y}, nb); break outerSp; }
            }
          if (!fired){
            outer:
            for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
              for (const [dx,dy] of [[1,0],[0,1]]){
                const x2 = x+dx, y2 = y+dy; if (x2 >= N || y2 >= N) continue;
                if (isSpecial(grid[y][x]) || isSpecial(grid[y2][x2])) continue;
                [grid[y][x], grid[y2][x2]] = [grid[y2][x2], grid[y][x]];
                const ok = findMatches(grid).size > 0;
                [grid[y][x], grid[y2][x2]] = [grid[y2][x2], grid[y][x]];
                if (ok){ await trySwap({x,y},{x:x2,y:y2}); break outer; }
              }
          }
        }
        await sleep(400);
      }
    })();
  }, 500);
}
resize();
refreshMenu(false);   // pre-populates daily's (hidden) stats; harmless before that screen is ever shown
// Cold-open: land straight in a live campaign board with zero clicks. The ?test= bot (above) already
// calls start() itself once it has set up its own requested mode, so it must not be double-started here.
if (!location.search.includes('test')) resumeMode();
setInterval(()=>{ if (!playing) dailyEl.textContent = fmtReset(); }, 30000);
scheduleCreature();   // begin the ambient-creature drift loop (no-op under reduced motion)
requestAnimationFrame(render);
/* Assets are declared/preloaded and the splash is on screen → tell the portal loading is done. */
PSDK.ready.then(()=>{ try { PSDK.loaded(); } catch(e){} });
</script>
