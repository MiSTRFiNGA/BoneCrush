<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crypt Match — the daily ossuary puzzle</title>
<meta name="description" content="Match skulls and bones in the catacomb. Everyone on Earth gets the identical board today — top the score before midnight resets it.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crypt Match">
<meta name="theme-color" content="#2b1d12">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:radial-gradient(circle at 50% 30%, #2b1d12 0%, #150e08 55%, #0a0705 100%); touch-action:none;
              font-family:'Segoe UI', system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
  #game { display:block; margin:0 auto; touch-action:none; }
  .ui { position:fixed; color:#e8dcc0; text-shadow:0 0 12px #ff8a00, 0 0 26px #c93400; z-index:5; }
  /* Score readout: BIG, animated (scale-pop + color-flash + count-up driven from render loop). */
  #hud { top:8px; left:16px; font-size:clamp(26px,5.4vw,54px); font-weight:900; letter-spacing:1px;
         transform-origin:top left; will-change:transform; line-height:1; }
  #moves { top:16px; right:64px; font-size:clamp(18px,3vw,30px); font-weight:800; }
  /* Left-side info panel (grim ossuary legend). Sits in the left margin on wide screens,
     collapsible overlay on narrow ones so the board always fits. */
  #infoToggle { top:70px; left:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.85;
                padding:4px 9px; background:rgba(20,16,14,.55); border:1px solid rgba(230,200,140,.3);
                border-radius:10px; z-index:6; }
  #infoPanel { top:112px; left:12px; width:212px; max-height:calc(100vh - 128px); overflow-y:auto;
               padding:12px 12px 14px; z-index:6; border-radius:14px;
               background:linear-gradient(180deg, rgba(28,20,14,.94), rgba(14,10,7,.96));
               border:1px solid rgba(196,150,86,.42);
               box-shadow:0 8px 30px rgba(0,0,0,.6), inset 0 0 26px rgba(120,70,20,.18);
               color:#e5d4ad; font-size:12px; text-shadow:0 1px 2px #000;
               scrollbar-width:thin; scrollbar-color:rgba(196,150,86,.5) transparent; }
  #infoPanel::-webkit-scrollbar { width:7px; }
  #infoPanel::-webkit-scrollbar-thumb { background:rgba(196,150,86,.5); border-radius:6px; }
  #infoPanel h3 { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#ffb454;
                  margin:12px 0 6px; border-bottom:1px solid rgba(196,150,86,.28); padding-bottom:3px;
                  text-shadow:0 0 10px rgba(255,138,0,.4); }
  #infoPanel h3:first-child { margin-top:0; }
  #infoPanel .row { display:flex; align-items:center; gap:8px; margin:4px 0; line-height:1.25; }
  #infoPanel .row img { width:26px; height:26px; flex:0 0 26px; object-fit:contain;
                        filter:drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  #infoPanel .row .nm { color:#f4e6c4; font-weight:700; }
  #infoPanel .row .ds { color:#c3a877; }
  #infoPanel .row .pts { margin-left:auto; color:#ffd24a; font-weight:800; white-space:nowrap; }
  #infoPanel ul { list-style:none; margin:2px 0 0; padding:0; }
  #infoPanel ul li { position:relative; padding:3px 0 3px 14px; color:#d8c39a; line-height:1.3; }
  #infoPanel ul li::before { content:'☠'; position:absolute; left:0; top:2px; color:#a5763a; font-size:10px; }
  #mute { top:8px; right:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.85; padding:4px 8px;
          background:rgba(20,16,14,.5); border:1px solid rgba(230,200,140,.3); border-radius:10px; }
  /* right-hand button column, top→bottom: 🔊 sfx · 🎵 music · 🐞 bug · 🏠 menu (#menuBtn, below) */
  #musicBtn { top:52px; right:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.85; padding:4px 8px;
         background:rgba(20,16,14,.5); border:1px solid rgba(230,200,140,.3); border-radius:10px; }
  #bug { top:96px; right:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.6; padding:4px 8px;
         background:rgba(20,16,14,.5); border:1px solid rgba(230,200,140,.3); border-radius:10px; }
  #overlay { inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:radial-gradient(ellipse at center, rgba(18,12,16,.6) 0%, rgba(6,4,7,.92) 100%);
             text-align:center; padding:20px; }
  /* Title logo (Eric's painted banner). Renamed Bone Crush -> Crypt Match 2026-07-30; the art
     asset itself still visually reads "BONE CRUSH" pending a repainted banner — alt text below
     already says CRYPT MATCH for a11y/SEO. Master copy: art_src/title_logo.png
     (5230x768) — THIS is the game logo for the splash, store pages, adverts and promo art.

  #overlay h1.logo { display:flex; align-items:center; justify-content:center;

  #overlay h1.logo img { width:min(92vw, 640px); height:auto; border-radius:10px;
                     box-shadow:0 4px 22px rgba(0,0,0,.65), 0 0 34px rgba(255,138,0,.35);
                     border:1px solid rgba(230,190,120,.35); }
  @keyframes logoFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes logoEmber { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.13)} }
  @media (prefers-reduced-motion:reduce){ #overlay h1.logo{animation:none} }
  #overlay .tag { font-size:clamp(12px,2.2vw,17px); color:#cbb488; margin-bottom:20px; }
  #overlay .big { font-size:clamp(18px,3.6vw,30px); margin:4px 0; font-weight:700; }
  #overlay .stats { display:flex; gap:22px; margin:12px 0 6px; flex-wrap:wrap; justify-content:center; }

  #overlay .go { margin-top:16px; font-size:clamp(15px,2.8vw,22px); padding:12px 40px; border-radius:40px;

  #overlay .share { margin-top:10px; font-size:clamp(11px,2vw,15px); padding:8px 24px; border-radius:30px;

           border-radius:22px; border:1px solid rgba(230,190,120,.5); font-size:13px; opacity:0; transition:opacity .3s; }
  .hidden { display:none !important; }
  /* mode select / level select / endless menu / run-end — share the ossuary parchment look */
  #objHud { top:16px; right:64px; margin-top:28px; font-size:clamp(12px,2.1vw,16px); font-weight:700; color:#d9a75f; }
  #menuBtn { top:140px; right:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.75; padding:4px 8px;
             background:rgba(20,16,14,.5); border:1px solid rgba(230,200,140,.3); border-radius:10px; }
  /* owner-only Forge opener — green so it reads as a tool, not part of the game chrome */
  #forgeBtn { top:184px; right:12px; font-size:clamp(18px,2.6vw,24px); cursor:pointer; opacity:.8; padding:4px 8px;
              background:rgba(12,26,16,.75); border:1px solid #2c5c3a; border-radius:10px; color:#9fe86f; }
  #modeSelect, #levelSelect, #runEnd { inset:0; display:flex; flex-direction:column; align-items:center;

             text-align:center; padding:20px; }
  .modeGrid { display:flex; flex-direction:column; gap:14px; margin-top:18px; width:min(92vw, 380px); }
  .modeBtn { display:flex; flex-direction:column; gap:3px; padding:16px 20px; border-radius:18px;
             background:linear-gradient(180deg, rgba(46,34,24,.8), rgba(24,17,12,.85)); color:#f4e6c4;
             border:1px solid rgba(220,190,130,.35); cursor:pointer; font-size:clamp(16px,3vw,22px); font-weight:800;

  .lsCell:not(.locked):hover { border-color:rgba(255,180,80,.7); box-shadow:0 0 16px rgba(255,140,0,.3); }
  /* B2: unlock-skip-token-eligible cell — visually distinct from a plain locked cell */
  .lsCell.skip { border-color:rgba(120,255,170,.55); color:#d8ffe4; }
  .lsCell.skip:hover { border-color:rgba(120,255,170,.9); box-shadow:0 0 16px rgba(120,255,170,.35); }
  /* B2 retention summary line inside the mode panel — quiet, read-only, never a gate */
  #msRetention { margin-top:16px; font-size:clamp(10px,1.8vw,13px); color:#c9a86a; line-height:1.7; text-align:center; }
  .lsNum { font-size:18px; }
  .lsStars { font-size:12px; letter-spacing:1px; color:#ffd24a; }
  .back { margin-top:18px; font-size:clamp(12px,2vw,15px); padding:8px 22px; border-radius:26px;
          background:rgba(34,26,22,.65); color:#eed9a8; border:1px solid rgba(230,190,120,.4); cursor:pointer; }
  .reStars { font-size:clamp(24px,4.5vw,36px); color:#ffd24a; letter-spacing:6px; margin:8px 0; text-shadow:0 0 16px rgba(255,180,60,.5); }
  /* Run-end stats: the .stat rules above are scoped to #overlay, so these rendered unstyled.
     Owner request 2026-07-30 — match the in-game skull HUD's size/glow so the level-complete

  #runEnd .stats { display:flex; gap:22px; margin:10px 0 4px; flex-wrap:wrap; justify-content:center; }
  #runEnd .stat { background:rgba(30,24,20,.6); border:1px solid rgba(220,190,130,.25);
                  border-radius:14px; padding:10px 20px; min-width:118px; }
  #runEnd .stat .v { font-size:clamp(26px,5.4vw,54px); font-weight:900; color:#f6ecd7; line-height:1;
                     text-shadow:0 0 12px #ff8a00, 0 0 26px #c93400; }
  #runEnd .stat .l { font-size:clamp(9px,1.6vw,12px); color:#c9a86a; letter-spacing:2px; text-transform:uppercase; margin-top:4px; }
  .reBtns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px; }

<body>
<canvas id="game"></canvas>
<div class="ui" id="hud"></div>
<div class="ui" id="moves"></div>
<div class="ui hidden" id="objHud"></div>
<div class="ui" id="mute" title="Sound effects">🔊</div>
<div class="ui" id="musicBtn" title="Music">🎵</div>
<div class="ui" id="bug" title="Download bug report (F8) · hold to open the Crypt Forge">🐞</div>
<div class="ui" id="menuBtn" title="Back to mode select">🏠</div>
<!-- Crypt Forge opener. Hidden by default and revealed by the script only when this is the owner's
     own build (localhost / file:// / the Capacitor APK) or ?forge is in the URL — a portal player
     on crazygames.com must never see a content editor. F2 still works everywhere. -->
<div class="ui hidden" id="forgeBtn" title="Crypt Forge — live content editor (F2)">⚱</div>
<div class="ui" id="infoToggle" title="Ossuary legend — pieces, powers & rules">📖</div>
<div class="ui hidden" id="infoPanel"></div>
<div class="ui" id="toast"></div>

<!-- PLATFORM_SDK -->
<script>
/* Platform adapter: no-op locally; the build script injects a real PSDK
   (CrazyGames SDK v3 / Poki SDK v2) above this line for store builds. */
window.PSDK = window.PSDK || { ready: Promise.resolve(), loaded(){}, start(){}, stop(){},
                               midgame(){ return Promise.resolve(); } };
</script>

<!-- Title screen + daily result screen (same panel, two states). Shown on load as the TITLE screen
     (owner request 2026-07-30, reversing the earlier B1 cold-open); also appears after a daily run
     ends, where refreshMenu(true) swaps in the score/streak/share result block. -->
<div class="ui hidden" id="overlay">
  <h1 class="logo"><img src="assets/title_logo.jpg" alt="CRYPT MATCH — a grim match-3 adventure"></h1>
  <div class="tag">Match the remains. Everyone on Earth digs the <b>same catacomb board</b> today.</div>
  <div id="resultBlock" class="hidden"><div class="big" id="scoreLine"></div></div>
  <div class="stats">
    <div class="stat"><div class="v" id="stBest">0</div><div class="l">Today's best</div></div>
    <div class="stat"><div class="v" id="stAll">0</div><div class="l">All-time</div></div>
    <div class="stat"><div class="v" id="stStreak">0🔥</div><div class="l">Day streak</div></div>
  </div>
  <button class="go" id="btnGo">DIG AGAIN</button>
  <button class="share hidden" id="btnShare">⚡ Challenge a friend</button>
  <div class="hint">Swap two relics to match 3+ · 30 moves · chains multiply the score</div>
  <div class="daily" id="daily"></div>
</div>
<!-- Non-blocking mode panel — reached ONLY via the 🏠 corner button, never shown automatically.
     The game always cold-opens straight into a live board (campaign frontier level for a fresh
     player, or their current level on return); this panel is purely for switching/pausing. -->
<div class="ui hidden" id="modeSelect">
  <h1 class="logo"><img src="assets/title_logo.jpg" alt="CRYPT MATCH"></h1>
  <div class="tag" id="msTag">Switch your dig.</div>
  <div class="modeGrid">
    <button class="modeBtn hidden" id="btnResume">▶ RESUME<span class="modeSub">Back to where you left off</span></button>
    <button class="modeBtn" id="btnCampaign">⚱️ CAMPAIGN<span class="modeSub">Level-by-level ossuary</span></button>
    <button class="modeBtn" id="btnEndless">♾️ ENDLESS<span class="modeSub">Dig till the moves run dry</span></button>
    <button class="modeBtn" id="btnDaily">📅 DAILY<span class="modeSub">Same board as everyone, today</span></button>
  </div>
  <!-- B2 retention summary — read-only, refreshed on every open via updateModePanelRetention().
       Purely informational ("always-visible next thing"); never blocks reaching the buttons above. -->
  <div class="modeSub" id="msRetention"></div>
</div>
<!-- Campaign level picker — reached via the CAMPAIGN tab or the 🏠 panel. Never shown on load. -->
<div class="ui hidden" id="levelSelect">
  <h2 class="lsTitle">⚱️ Campaign</h2>
  <div class="lsGrid" id="lsGrid"></div>
  <button class="back" id="lsBack">‹ Back</button>
</div>
<!-- Campaign/Endless run-end popup (win, lose, or endless-out-of-moves). Built dynamically so the
     primary action (RETRY / NEXT LEVEL / DIG AGAIN) is always the prominent one-tap default —
     never a forced trip back through a menu. -->
<div class="ui hidden" id="runEnd">
  <div class="big" id="reTitle"></div>
  <div class="reStars" id="reStars"></div>
  <div class="stats" id="reStats"></div>
  <div class="reBtns" id="reBtns"></div>
</div>
<script>
"use strict";
/* CRYPT MATCH (formerly Bone Crush) — daily-seeded match-3. No backend; same board worldwide per UTC day. */
const N = 8, MOVES0 = 30;
/* TYPES = how many normal piece types are in play. Shipped default 8 (asset drop 02 added
   cat/cauldron/heart); the Crypt Forge PIECES tab can add/remove types live, so this is a `let`
   and every spawn site reads it fresh. Floor of 4 is enforced in cmApply — below that the board
   deadlocks into constant cascades. */
let TYPES = 8;
const cv = document.getElementById('game'), cx = cv.getContext('2d');
let CELL = 64, PAD = 0, TOPPAD = 56, DPR = 1;
/* PERF: the stone-floor board background (per-cell linear gradient + dirt speckle + highlight line)
   used to be rebuilt from scratch — including a fresh createLinearGradient() per cell — on EVERY
   render() frame, unconditionally, whether or not anything on the board was even animating. Gradient
   rasterization cost scales with the filled area, which scales with CELL^2, so this got dramatically
   more expensive on large/unfolded screens (bigger CELL) even though the board content never changes
   between resizes. Fix: pre-render it once into an offscreen canvas and just drawImage() it each frame;
   rebuild only when CELL, DPR, or the active cosmetic skin actually changes (see boardBgIsStale()). */
let boardBG = document.createElement('canvas'), boardBGCx = boardBG.getContext('2d'), boardBGKey = '';
function boardBgIsStale(){
  return boardBGKey !== (CELL + ':' + DPR + ':' + (save.cosmetics.activeSkin % BOARD_SKINS.length));
}
function rebuildBoardBG(){
  boardBG.width = CELL * N * DPR; boardBG.height = CELL * N * DPR;
  boardBGCx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const skin = BOARD_SKINS[save.cosmetics.activeSkin % BOARD_SKINS.length] || BOARD_SKINS[0];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const g = boardBGCx.createLinearGradient(x*CELL, y*CELL, x*CELL, y*CELL+CELL);
    const pair = (x+y) % 2 ? skin.b : skin.a;
    g.addColorStop(0, pair[0]); g.addColorStop(1, pair[1]);
    boardBGCx.fillStyle = g;
    boardBGCx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
    // dirt speckle (stable per cell)
    const sr = mulberry32(x*73 + y*131);
    boardBGCx.fillStyle = 'rgba(0,0,0,.25)';
    for (let k = 0; k < 4; k++) boardBGCx.fillRect(x*CELL + 4 + sr()*(CELL-10), y*CELL + 4 + sr()*(CELL-10), 2, 2);
    boardBGCx.fillStyle = 'rgba(255,220,160,.06)';
    boardBGCx.fillRect(x*CELL+1, y*CELL+1, CELL-2, 2);
  }
  boardBGKey = CELL + ':' + DPR + ':' + (save.cosmetics.activeSkin % BOARD_SKINS.length);
}
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  const s = Math.min(innerWidth, innerHeight - 56);
  CELL = Math.floor(s / N);
  cv.width  = CELL * N * DPR; cv.height = CELL * N * DPR;
  cv.style.width = CELL*N + 'px'; cv.style.height = CELL*N + 'px';
  cv.style.marginTop = Math.max(48, (innerHeight - CELL*N) / 2) + 'px';
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (typeof BOARD_SKINS !== 'undefined') rebuildBoardBG();   // CELL changed -> cached bg is stale
  if (typeof autoInfo === 'function') autoInfo();
}
addEventListener('resize', ()=>{ resize(); });

function utcDayKey(){ const d = new Date(); return d.getUTCFullYear()*10000 + (d.getUTCMonth()+1)*100 + d.getUTCDate(); }
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a);
  t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
function msToReset(){ const n = new Date(); return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1) - n.getTime(); }
function adjacentDay(a, b){ if (!a) return false;
  const pa = Date.UTC(Math.floor(a/10000), Math.floor(a/100)%100-1, a%100);
  const pb = Date.UTC(Math.floor(b/10000), Math.floor(b/100)%100-1, b%100);
  return pb - pa === 86400000; }
const store = {
  // NOTE: 'bonecrush_' prefix + the bc_* keys below are legacy-but-load-bearing localStorage
  // keys from the original "Bone Crush" name. Renaming them would wipe every existing player's
  // saved progress/streak, so they are kept exactly as-is despite the 2026-07-30 rename to
  // "Crypt Match" — see BoneCrush -> Crypt Match rename notes.
  get k(){ return 'bonecrush_' + utcDayKey(); },
  load(){ return { all:+localStorage.bc_all||0, today:+localStorage[this.k]||0 }; },
  save(sc){ const dk = utcDayKey();
    if (sc > (+localStorage[this.k]||0)) localStorage[this.k] = sc;
    if (sc > (+localStorage.bc_all||0)) localStorage.bc_all = sc;
    const last = +localStorage.bc_lastday||0;
    if (last !== dk){ localStorage.bc_streak = adjacentDay(last,dk) ? (+localStorage.bc_streak||0)+1 : 1;
      localStorage.bc_lastday = dk; } }
};

/* ── CAMPAIGN LEVEL TABLE ──────────────────────────────────────────────────
   Structural placeholder only — ~10 gentle levels covering all 4 objective
   types (score / clearType / drop / tiles) so the scaffold (level select,
   objective HUD, stars, unlocks, special-gating) is fully exercised end to
   end. This whole array is meant to be thrown away: every consumer reads
   LEVELS[i].{objective,target,type,count,moves,stars} generically, so
   dropping in Grok's balanced curve here is a pure data swap. */
const LEVELS = [
  // Grok's 40-level curve (campaign_curve_40.json, 2026-07-29) — L1-5 nearly unloseable
  // (the conversion metric), 6-15 gentle, 16-30 real difficulty, 31-40 hard but never a wall.
  { objective:'score',     target:400,  moves:30, stars:[400,700,1100] },
  { objective:'clearType', type:0, count:8,  moves:30, stars:[8,14,20] },

/* ── PROGRESSION SAVE ── one versioned localStorage object. loadSave() always
   merges forward: any field missing from a stored save (new field added in a
   later version, or a save from before campaign existed) is filled from
   defaults rather than the whole object being discarded — progress must
   survive a schema bump, never get wiped by one. */
const SAVE_KEY = 'bc_save_v1', SAVE_VERSION = 2;
/* v2 (Phase B2 — RETENTION, campaign_curve_40.json retention_economy block) adds:
   login (daily-login streak, separate from the legacy bc_streak/bc_lastday daily-board streak —
   that pair is untouched so the Daily overlay keeps working exactly as before), retention
   (streak-freeze charges), quests (3 daily quests + progress), chest (star-chest claim tier),
   inventory (special charges / banked bonus moves / unlock-skip tokens), cosmetics (board skins),
   and ftue (per-level-per-day free-retry grants for L1-5). A save with NO v2 fields (a real v1
   save) upgrades below by filling every new field from defaults — campaign.unlocked/stars and
   endlessBest are never touched by this migration. */
function defaultSave(){
  return {
    version: SAVE_VERSION,
    campaign: { unlocked: 1, stars: new Array(LEVELS.length).fill(0) },
    endlessBest: 0,
    login: { streak: 0, lastDay: 0 },
    retention: { streakFreezeCount: 0 },
    quests: { day: 0, done: { clear_any_3:false, three_star_1:false, endless_2k:false }, clearCount: 0 },
    chest: { claimedTiers: 0 },
    inventory: { charges: { fingerjar:0, megabone:0, hand:0, key:0 }, movesBonus: 0, unlockSkipTokens: 0 },
    cosmetics: { skinsOwned: 1, activeSkin: 0 },
    ftue: {},

}
function loadSave(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){ raw = null; }
  const base = defaultSave();
  if (!raw || typeof raw !== 'object') return base;
  const merged = { ...base, ...raw,
    campaign: { ...base.campaign, ...(raw.campaign||{}) },
    login: { ...base.login, ...(raw.login||{}) },
    retention: { ...base.retention, ...(raw.retention||{}) },
    quests: { ...base.quests, ...(raw.quests||{}), done: { ...base.quests.done, ...((raw.quests||{}).done||{}) } },
    chest: { ...base.chest, ...(raw.chest||{}) },
    inventory: { ...base.inventory, ...(raw.inventory||{}),
                 charges: { ...base.inventory.charges, ...((raw.inventory||{}).charges||{}) } },
    cosmetics: { ...base.cosmetics, ...(raw.cosmetics||{}) },
    ftue: { ...(raw.ftue||{}) },
  };
  if (!Array.isArray(merged.campaign.stars) || merged.campaign.stars.length !== LEVELS.length){
    const old = Array.isArray(merged.campaign.stars) ? merged.campaign.stars : [];
    merged.campaign.stars = LEVELS.map((_,i)=> old[i] || 0);   // keep whatever stars line up, default rest
  }
  merged.campaign.unlocked = Math.min(Math.max(1, merged.campaign.unlocked||1), LEVELS.length);
  merged.endlessBest = +merged.endlessBest || 0;
  merged.cosmetics.activeSkin = Math.min(Math.max(0, merged.cosmetics.activeSkin||0), Math.max(0, (merged.cosmetics.skinsOwned||1)-1));
  merged.version = SAVE_VERSION;
  return merged;
}

/* ══ GAMEPLAY MUSIC ════════════════════════════════════════════════════════
   Two sources, one switch (Crypt Forge → AUDIO tab):
     • SYNTH (shipped default) — a slow WebAudio crypt dirge: sustained minor drone, sparse
       pentatonic plucks and a heartbeat thud. No asset, so it costs the APK nothing and works
       offline. Tempo/key/volume are editable.
     • TRACK — any audio file the owner drops in, looped. Stored as a data: URL in localStorage
       alongside the imported SFX bank, so it survives reloads and travels in the Forge export.
   Music is deliberately GAMEPLAY-only: it starts when a board starts and stops on the menu /
   game-over screens. Browsers (and the Android WebView) refuse audio before a user gesture, so
   nothing is created until the first pointer/key event. Its mute is SEPARATE from the SFX mute —
   🔇 kills sound effects, 🎵 kills music, and each remembers its own setting. */
let musicMuted = localStorage.bc_mute_music === '1';

const music = (function(){

      if (!el || elSrc !== MUSIC_CFG.src){ if (el) try { el.pause(); } catch(e){}
        el = new Audio(MUSIC_CFG.src); el.loop = true; elSrc = MUSIC_CFG.src; }

function grantDailyLoginReward(day){

  else if (day === 2){ save.inventory.movesBonus = (save.inventory.movesBonus||0) + 5; msg = '+5 moves next campaign level'; }
  else if (day === 3){ grantSpecialCharge('megabone'); msg = 'Megabone charge'; }

/* PERF: SPECIAL pieces used to allocate+rasterize a fresh createRadialGradient() EVERY frame for
   EVERY special on the board, at a radius (r*1.5) that scales with CELL — expensive on large screens.
   Fix: pre-render the glow (at pulse=1, the max radius) once per (specialIdx, CELL) into an offscreen
   canvas, then just drawImage() it each frame, uniformly scaled by the current pulse. Scaling a raster
   image is a cheap GPU blit; the result is pixel-equivalent to a freshly-rasterized gradient at that
   scaled radius because a radial gradient's relative stop positions are scale-invariant. */
let specialGlowCache = [], specialGlowCacheCell = -1;
function rebuildSpecialGlowCache(r){
  specialGlowCache = SPECIAL_DEFS.map(def => {
    const size = Math.max(2, Math.ceil(r*3));
    const c = document.createElement('canvas'); c.width = size; c.height = size;
    const gctx = c.getContext('2d');
    const gg = gctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, r*1.5);
    gg.addColorStop(0, def.glow); gg.addColorStop(.4, def.glow + '88'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    gctx.fillStyle = gg; gctx.beginPath(); gctx.arc(size/2, size/2, r*1.5, 0, 7); gctx.fill();
    return c;
  });
  specialGlowCacheCell = r;
}
function drawPiece(t, x, y, r, wob){
  cx.save(); cx.translate(x, y); if (wob) cx.rotate(Math.sin(wob)*.08);
  // drop shadow + under-glow make relics pop off the stone
  cx.fillStyle = 'rgba(0,0,0,.45)';
  cx.beginPath(); cx.ellipse(0, r*.72, r*.55, r*.16, 0, 0, 7); cx.fill();
  // SPECIAL power piece: pulsing additive glow aura behind the sprite, then draw the extra sprite
  if (isSpecial(t)){
    const def = SPECIAL_DEFS[specialIdx(t)], spr = SP_SPRITES[specialIdx(t)];
    const pulse = 0.6 + 0.4*Math.sin(t0*0.006 + x*0.03 + y*0.03);
    if (specialGlowCacheCell !== r) rebuildSpecialGlowCache(r);
    cx.save(); cx.globalCompositeOperation = 'lighter';
    const glowImg = specialGlowCache[specialIdx(t)], gs = glowImg.width;
    cx.globalAlpha = .55 + .3*pulse;
    cx.drawImage(glowImg, -gs/2*pulse, -gs/2*pulse, gs*pulse, gs*pulse);
    cx.restore();
    if (spr && !spr._failed && spr.complete && spr.naturalWidth)
      cx.drawImage(spr, -r*1.02, -r*1.05, r*2.04, r*2.04);
    else { cx.fillStyle = def.glow; cx.beginPath(); cx.arc(0, 0, r*.6, 0, 7); cx.fill(); }
    cx.restore(); return;
  }
  // sprite override (keeps the grounding shadow + wobble), else vector fallback below
  const spr = SPRITES[t];
  if (spr && !spr._failed && spr.complete && spr.naturalWidth){
    cx.drawImage(spr, -r*1.05, -r*1.1, r*2.1, r*2.1);
    cx.restore(); return;
  }
  cx.fillStyle = COLS[t]; cx.strokeStyle = 'rgba(0,0,0,.55)'; cx.lineWidth = 2;
  if (t === 0){ // skull
    cx.beginPath(); cx.arc(0, -r*.1, r*.72, 0, 7); cx.fill();
    cx.fillRect(-r*.4, r*.28, r*.8, r*.42);
    cx.fillStyle = '#1a1218';
    cx.beginPath(); cx.arc(-r*.28, -r*.15, r*.2, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(r*.28, -r*.15, r*.2, 0, 7); cx.fill();
    cx.fillRect(-r*.07, r*.05, r*.14, r*.2);
    cx.fillRect(-r*.3, r*.42, r*.12, r*.2); cx.fillRect(-r*.06, r*.42, r*.12, r*.2); cx.fillRect(r*.18, r*.42, r*.12, r*.2);
  } else if (t === 1){ // crossbones
    for (const a of [-.785, .785]){
      cx.save(); cx.rotate(a);
      cx.fillRect(-r*.72, -r*.1, r*1.44, r*.2);
      for (const e of [-1,1]){ cx.beginPath(); cx.arc(e*r*.72, -r*.08, r*.14, 0, 7);
        cx.arc(e*r*.72, r*.08, r*.14, 0, 7); cx.fill(); }
      cx.restore();
    }
  } else if (t === 2){ // ribcage
    cx.fillRect(-r*.08, -r*.7, r*.16, r*1.4);
    for (let i = 0; i < 4; i++){ const yy = -r*.5 + i*r*.32;
      cx.beginPath(); cx.ellipse(0, yy, r*.55, r*.12, 0, 0, 7); cx.fill(); }
  } else if (t === 3){ // femur
    cx.save(); cx.rotate(.6);
    cx.fillRect(-r*.6, -r*.12, r*1.2, r*.24);
    for (const e of [-1,1]){ cx.beginPath(); cx.arc(e*r*.6, -r*.1, r*.17, 0, 7);
      cx.arc(e*r*.6, r*.1, r*.17, 0, 7); cx.fill(); }
    cx.restore();
  } else { // ember gem (eye)
    cx.beginPath(); for (let i = 0; i < 6; i++){ const a = i*Math.PI/3;
      cx[i?'lineTo':'moveTo'](Math.cos(a)*r*.65, Math.sin(a)*r*.65); }
    cx.closePath(); cx.fill();
    const g = cx.createRadialGradient(0,0,0, 0,0,r*.4);
    g.addColorStop(0,'#fff3c0'); g.addColorStop(1,'rgba(255,120,20,.15)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, r*.4, 0, 7); cx.fill();
  }
  cx.restore();
}

/* ambiance: cosmetic creatures drifting behind the board. Purely decorative, low opacity,

const REDUCED_MOTION = matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
let creatures = [];

function scheduleCreature(){ setTimeout(()=>{ if (!REDUCED_MOTION) spawnCreature(); scheduleCreature(); },
  (15 + Math.random()*25) * 1000); }   // every ~15-40s
function drawCreatures(dt){
  const W = CELL*N;
  cx.save(); cx.globalAlpha = 0.16;   // low opacity so they don't distract
  for (let i = creatures.length-1; i >= 0; i--){ const c = creatures[i]; c.t += dt; c.x += c.dir*c.sp*dt;
    if (c.x < -100 || c.x > W+100){ creatures.splice(i,1); continue; }

    else if (c.kind === 'cat'){ cx.fillText('🐈‍⬛', 0, Math.sin(c.t*10)*2); }
    else { cx.globalAlpha = 0.22; cx.fillText('🌕', 0, -CELL*0.1); cx.globalAlpha = 1; cx.fillText('🧙', 0, 0); }

/* Shared board generator — same no-pre-existing-match rule for every mode.
   Daily seeds off the UTC day key (unchanged); endless/campaign pass their own seed. */
function makeBoard(seed){
  const r = mulberry32(seed);
  const g = [];
  for (let y = 0; y < N; y++){ g.push([]);
    for (let x = 0; x < N; x++){
      let t;
      do { t = Math.floor(r()*TYPES); }
      while ((x >= 2 && g[y][x-1] === t && g[y][x-2] === t) ||
             (y >= 2 && g[y-1][x] === t && g[y-2][x] === t));
      g[y].push(t);
    } }
  return g;
}
function rngBoard(){ return makeBoard(utcDayKey() ^ 0xB0E5); }   // identical to the original daily board — unchanged
function findMatches(g){
  const m = new Set();
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const t = g[y][x]; if (t < 0 || t >= SP_BASE) continue;   // specials never match by color
    if (x <= N-3 && g[y][x+1] === t && g[y][x+2] === t){ let k = x; while (k < N && g[y][k] === t){ m.add(y*N+k); k++; } }
    if (y <= N-3 && g[y+1][x] === t && g[y+2][x] === t){ let k = y; while (k < N && g[k][x] === t){ m.add(k*N+x); k++; } }
  }
  return m;
}
function anyMovePossible(g){
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    for (const [dx,dy] of [[1,0],[0,1]]){

      [g[y][x], g[y2][x2]] = [g[y2][x2], g[y][x]];
      const ok = findMatches(g).size > 0;

/* Animated score counter: roll `scoreShown` up toward `scoreTarget`, with a scale-pop + colour flash.
   Driven every frame so the number visibly climbs as flyers land. */
/* Big HUD now reads "have / need" for whatever this level actually asks for (owner request
   2026-07-30) — on a collect/drop/tiles level the raw score isn't the number you're chasing, so
   showing it there was useless. Daily has no target by design, so it stays a bare score. */
function goalNums(){
  if (MODE === 'campaign' && campaignState){
    const L = LEVELS[campaignLevelIdx];
    return L.objective === 'score' ? [Math.round(scoreShown), L.target]
                                   : [campaignState.progress, L.count];
  }
  if (MODE === 'endless') return [Math.round(scoreShown), endlessTarget];
  return [Math.round(scoreShown), null];
}
function tickScore(dt){
  scoreShown += (scoreTarget - scoreShown) * Math.min(1, dt*9);
  if (Math.abs(scoreTarget - scoreShown) < 0.6) scoreShown = scoreTarget;
  hudPulse = Math.max(0, hudPulse - dt*3.0);
  hudFlash = Math.max(0, hudFlash - dt*2.4);
  const [cur, need] = goalNums();
  hud.textContent = '💀 ' + cur + (need ? '/' + need : '');
  hud.style.transform = 'scale(' + (1 + hudPulse*0.30).toFixed(3) + ')';
  if (hudFlash > 0){ const f = hudFlash;
    hud.style.color = '#fff';
    hud.style.textShadow = `0 0 ${(12+f*34).toFixed(0)}px #ffe27a, 0 0 ${(26+f*54).toFixed(0)}px #ff8a00, 0 0 42px #c93400`;
  } else { hud.style.color = ''; hud.style.textShadow = ''; }
}
/* PERF: shadowBlur is notoriously expensive to rasterize on mobile GPUs, and (like the gradients
   above) its cost scales with the blurred area — worse on large screens. Rather than hardcode a
   screen-size cutoff (fragile — what about a large but powerful tablet, or a small but weak phone?),
   track a smoothed FPS from the render loop itself and only pay for shadowBlur glow effects while the
   device is actually keeping up; on a struggling frame rate the effects fall back to their existing
   flat-fill look (no shadowBlur call at all) instead of chasing a blur the device can't afford.
   ?perf=1 also draws a small on-canvas HUD with this + the frame-time stats used for verification. */
let fpsAvg = 60;
const PERF_FLAG = typeof location !== 'undefined' && /[?&]perf=1\b/.test(location.search);
/* render */
function render(t){
  requestAnimationFrame(render);
  const dt = Math.min(.05, (t - t0)/1000 || .016); t0 = t;
  if (dt > 0) fpsAvg += (Math.min(120, 1/dt) - fpsAvg) * 0.08;   // smoothed, so one hitch doesn't flip the gate
  const glowOK = fpsAvg >= 50;   // allow shadowBlur glow only while comfortably at/near 60fps
  tickScore(dt);
  const hudT = hudTargetCanvas();   // score-counter target for flyers (cached once per frame)
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.save();
  if (shake > 0){ shake = Math.max(0, shake - dt*40);
    cx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); }
  // stone cells with beveled depth — palette is the player's active board skin (B2 star-chest reward;
  // index 0 is the original hardcoded look, so a fresh/default save renders pixel-identical to before).
  // PERF: pre-rendered once into boardBG (see rebuildBoardBG above) instead of 64 fresh
  // createLinearGradient() calls every single frame — this is the single biggest render-loop cost on
  // large screens, since each gradient's fill area (and thus rasterization cost) scales with CELL^2.
  if (boardBgIsStale()) rebuildBoardBG();
  cx.drawImage(boardBG, 0, 0, CELL*N, CELL*N);
  drawCreatures(dt);   // cosmetic creatures drift behind the pieces (above the stone floor)
  if (sel){ cx.strokeStyle = '#ffcf7d'; cx.lineWidth = 3;
    cx.strokeRect(sel.x*CELL+2, sel.y*CELL+2, CELL-4, CELL-4); }
  if (grid.length)
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
      if (grid[y][x] >= 0)
        drawPiece(grid[y][x], x*CELL + CELL/2, y*CELL + CELL/2, CELL*.42,
                  sel && sel.x === x && sel.y === y ? t*.02 : 0);
  // campaign 'tiles' objective: a sealed crypt crust over each un-cleared tile cell, drawn on top
  // of the piece beneath it so it visibly needs matching-through to break.
  if (MODE === 'campaign' && campaignState && campaignState.crypt){
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (campaignState.crypt[y][x]){
      cx.save(); cx.globalAlpha = .55;
      cx.fillStyle = 'rgba(40,30,20,.55)';
      cx.fillRect(x*CELL+3, y*CELL+3, CELL-6, CELL-6);
      cx.strokeStyle = 'rgba(180,140,80,.6)'; cx.lineWidth = 2;
      cx.strokeRect(x*CELL+3, y*CELL+3, CELL-6, CELL-6);
      cx.beginPath(); cx.moveTo(x*CELL+8, y*CELL+8); cx.lineTo(x*CELL+CELL-10, y*CELL+CELL-14);
      cx.moveTo(x*CELL+CELL-10, y*CELL+10); cx.lineTo(x*CELL+10, y*CELL+CELL-8);
      cx.strokeStyle = 'rgba(20,14,10,.5)'; cx.lineWidth = 1.4; cx.stroke();
      cx.restore();
    }
  }
  // radial flash blooms — bright additive gradient burst at each cleared cell (fakes ray-traced bloom)
  for (let i = flashes.length-1; i >= 0; i--){ const f = flashes[i]; f.t += dt;
    if (f.t > f.life){ flashes.splice(i,1); continue; }
    const k = f.t / f.life, rad = f.r * (0.4 + k*1.2);
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = (1-k)*(1-k);
    const fg = cx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rad);
    fg.addColorStop(0, 'rgba(255,255,240,1)'); fg.addColorStop(.35, 'rgba(255,190,90,.7)');
    fg.addColorStop(1, 'rgba(255,120,20,0)');
    cx.fillStyle = fg; cx.beginPath(); cx.arc(f.x, f.y, rad, 0, 7); cx.fill();
    cx.restore();
  }
  // "raytrace" light beams — rotating additive rays fanning out from each crush, with a hot core flash
  for (let i = rays.length-1; i >= 0; i--){ const R = rays[i]; R.t += dt;
    if (R.t > R.life){ rays.splice(i,1); continue; }
    const k = R.t / R.life, a = (1-k)*(1-k), len = R.len * (0.35 + k*1.1);
    cx.save(); cx.globalCompositeOperation = 'lighter';
    cx.translate(R.x, R.y); cx.rotate(R.rot + R.t*R.vr);
    for (let j = 0; j < R.n; j++){
      cx.rotate(Math.PI*2 / R.n);
      const lg = cx.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, 'rgba(255,250,230,' + (a*.9).toFixed(3) + ')');
      lg.addColorStop(.5, R.col);
      lg.addColorStop(1, 'rgba(0,0,0,0)');
      cx.globalAlpha = a * .55;
      cx.fillStyle = lg;
      cx.beginPath(); cx.moveTo(0, -2.5*(1-k) - .5); cx.lineTo(len, 0); cx.lineTo(0, 2.5*(1-k) + .5);
      cx.closePath(); cx.fill();
    }
    // bright core flash on top of the rays
    cx.globalAlpha = a;
    const cg = cx.createRadialGradient(0, 0, 0, 0, 0, len*.28);
    cg.addColorStop(0, 'rgba(255,255,250,1)'); cg.addColorStop(.5, 'rgba(255,220,140,.6)');
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = cg; cx.beginPath(); cx.arc(0, 0, len*.28, 0, 7); cx.fill();
    cx.restore();
  }
  // knife slash streaks — bright tapered cut with a hot head sweeping corner-to-corner (additive)
  for (let i = slashes.length-1; i >= 0; i--){ const s = slashes[i]; s.t += dt;
    if (s.t > s.life){ slashes.splice(i,1); continue; }
    const k = s.t / s.life, a = (1-k)*(1-k);
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = a;
    const lg = cx.createLinearGradient(s.x1, s.y1, s.x2, s.y2);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, s.col); lg.addColorStop(1, 'rgba(255,255,255,0)');
    cx.strokeStyle = lg; cx.lineWidth = (1-k)*11 + 2; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(s.x1, s.y1); cx.lineTo(s.x2, s.y2); cx.stroke();
    const hx = s.x1 + (s.x2-s.x1)*k, hy = s.y1 + (s.y2-s.y1)*k;
    const cg = cx.createRadialGradient(hx, hy, 0, hx, hy, CELL*.62);
    cg.addColorStop(0, 'rgba(255,255,250,' + a.toFixed(3) + ')'); cg.addColorStop(1, 'rgba(255,220,140,0)');
    cx.fillStyle = cg; cx.beginPath(); cx.arc(hx, hy, CELL*.62, 0, 7); cx.fill();
    cx.restore();
  }
  // glowing angel wings — feathers fan up-and-outward from the cross centre, then fade (additive)
  for (let i = wings.length-1; i >= 0; i--){ const w = wings[i]; w.t += dt;
    if (w.t > w.life){ wings.splice(i,1); continue; }
    const k = w.t / w.life, spread = CELL*(0.55 + k*2.6);

  #cf button.warn{border-color:#a33;color:#f88} #cf .hint{color:#7a9;font-size:11px;margin-bottom:8px;line-height:1.45}
  #cf .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
  #cf .x{position:absolute;right:8px;top:6px;cursor:pointer;color:#9fe86f;font-size:16px}`;
  document.head.appendChild(st);
  const w = document.createElement('div'); w.id = 'cf';
  w.innerHTML = `<h3>⚱ CRYPT FORGE — live content editor <span class="x" id="cfX">✕</span></h3>
    <div class="tabs" id="cfT"></div><div class="bd" id="cfB"></div>`;
  document.body.appendChild(w);
  const bd = w.querySelector('#cfB'), tabsEl = w.querySelector('#cfT');
  const TABS = ['PIECES','RELICS','LEVELS','AUDIO','DATA']; let tab = 0;
  TABS.forEach((t,i)=>{ const d=document.createElement('div'); d.textContent=t;
    d.onclick=()=>{ tab=i; draw(); }; tabsEl.appendChild(d); });
  w.querySelector('#cfX').onclick = () => w.classList.remove('on');
  // Recomputed per draw — the clip bank grows as sounds are imported on the AUDIO tab.
  const clipNames = () => Object.keys(CLIPS);
  const clipList = () => clipNames().join(', ');
  // one delegated input handler: data-cp="pieces.2.value" writes straight into CEDIT
  bd.addEventListener('input', e => { const p = e.target.dataset.cp; if (!p) return;
    const ks = p.split('.'), last = ks.pop(), o = ks.reduce((a,k)=>a[k], CEDIT);
    o[last] = (e.target.type === 'number' || e.target.type === 'range') ? parseFloat(e.target.value) : e.target.value;
    cmSave(); cmApply();
    if (p === 'music.volume') e.target.nextElementSibling.textContent = Math.round(o[last]*100) + '%'; });
  const m0 = s => String(s == null ? '' : s).replace(/"/g, '&quot;');   // safe in a value="…" attribute
  function art(kind, i, cur){   // thumbnail that opens a file picker to replace that sprite
    const k = kind + i, src = CM_ART[k] || (cur ? 'assets/' + cur : '');
    // Added relic with no art yet: an empty <img> renders as a broken-image icon, so show a
    // "drop art here" placeholder instead. Same data-cfart hook, same click-to-replace behaviour.
    if (!src) return `<span data-cfart="${k}" title="click to add art" style="display:inline-flex;height:30px;width:30px;
      align-items:center;justify-content:center;border:1px dashed #2c5c3a;border-radius:3px;cursor:pointer;color:#5a8">＋</span>`;
    return `<img data-cfart="${k}" src="${src}" title="click to replace" style="height:30px;width:30px;object-fit:contain;
      border:1px solid #2c5c3a;border-radius:3px;cursor:pointer;background:#0c1710">` +
      (CM_ART[k] ? `<span data-cfclr="${k}" style="color:#f66;cursor:pointer;font-weight:900;margin-left:4px">✕</span>` : '');
  }
  function draw(){
    tabsEl.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('on', i===tab));
    let h = '';
    if (tab===0){
      h = `<div class="hint">Every relic on the board: art, name, score value, burst colour and match sound.
        VALUE = base points for one piece (chain multipliers apply on top). SFX = comma-separated clip names, one picked
        at random per match. COLOUR tints the shatter particles and is also the fallback shape drawn when a piece has no art.
        <br>ADD RELIC appends a brand-new type — it starts spawning immediately as the board refills, so drop art on it first.
        Only added relics can be deleted (the 8 shipped ones stay), and the board needs at least 4 types.
        <br>Available clips: <b>${clipList()}</b></div>
        <table><tr><th>ART</th><th>PIECE</th><th>VALUE</th><th>COLOUR</th><th>MATCH SFX</th><th></th></tr>`;
      CEDIT.pieces.forEach((p,i)=>{ h += `<tr><td>${art('p',i,SPRITE_FILES[i])}</td>
        <td><input data-cp="pieces.${i}.name" value="${p.name}" style="width:110px"></td>
        <td><input type="number" data-cp="pieces.${i}.value" value="${p.value}" style="width:56px"></td>
        <td><input type="color" data-cp="pieces.${i}.color" value="${p.color||'#c9a86a'}" style="width:34px;height:22px;padding:0;border:none"></td>
        <td><input data-cp="pieces.${i}.sfx" value="${p.sfx}" style="width:190px"></td>
        <td>${i >= CM_BASE_TYPES && CEDIT.pieces.length > 4
              ? `<button class="warn" data-cfdel="${i}" title="delete this added relic">✕</button>`
              : '<span style="color:#456">shipped</span>'}</td></tr>`; });
      h += `</table><div class="row"><button id="cfAdd">＋ ADD RELIC</button>
        <span style="color:#7a9">${CEDIT.pieces.length} types in play</span></div>`;
    } else if (tab===1){
      h = `<div class="hint">Relic art, name, glow colour, description and detonation sound.
        <b>What each relic DOES is fixed in code</b> — this edits how it looks, reads and sounds, plus which campaign level unlocks it
        (blank = always available). Available clips: <b>${clipList()}</b></div>
        <table><tr><th>ART</th><th>RELIC</th><th>GLOW</th><th>DESCRIPTION</th><th>SFX</th><th>UNLOCK LVL</th></tr>`;
      CEDIT.specials.forEach((s,i)=>{ const id = SPECIAL_DEFS[i].id;
        h += `<tr><td>${art('s',i,SPECIAL_DEFS[i].file)}</td>
        <td><input data-cp="specials.${i}.name" value="${s.name}" style="width:100px"></td>
        <td><input type="color" data-cp="specials.${i}.glow" value="${s.glow}" style="width:34px;height:22px;padding:0;border:none"></td>
        <td><input data-cp="specials.${i}.label" value="${s.label}" style="width:180px"></td>
        <td><input data-cp="specials.${i}.sfx" value="${s.sfx}" style="width:150px"></td>
        <td><input type="number" data-cfu="${id}" value="${CEDIT.unlocks[id]!==undefined?CEDIT.unlocks[id]:''}" placeholder="—" style="width:52px"></td></tr>`; });
      h += '</table>';
    } else if (tab===2){
      h = `<div class="hint">Campaign curve. TARGET only applies to score levels (others are collect/drop/tile counts, shown greyed).
        Changing TARGET also moves the 1-star gate, which is the pass mark. Edits are live — reopen a level to test it.</div>
        <table><tr><th>LVL</th><th>OBJECTIVE</th><th>TARGET</th><th>MOVES</th></tr>`;
      CEDIT.levels.forEach((L,i)=>{ const T = LEVELS[i], isScore = T.objective === 'score';
        h += `<tr><td>${i+1}</td><td style="color:#7fc76f">${T.objective}${isScore?'':' ×'+(T.count||0)}</td>
        <td>${isScore?`<input type="number" data-cp="levels.${i}.target" value="${L.target}" style="width:70px">`:'<span style="color:#567">n/a</span>'}</td>
        <td><input type="number" data-cp="levels.${i}.moves" value="${L.moves}" style="width:52px"></td></tr>`; });
      h += '</table>';
    } else if (tab===3){
      const m = CEDIT.music, opts = ['<option value="">— synth crypt dirge (built in) —</option>']
        .concat(Object.keys(CM_AUD).map(n => `<option value="${n}"${m.clip===n?' selected':''}>${n}</option>`)).join('');
      h = `<div class="hint">The three interaction voices. Leave a field EMPTY for the shipped synth beep, or put in
        clip names (comma-separated → one picked at random). Per-relic <i>match</i> sounds live on the PIECES tab and
        relic detonations on RELICS — everything here and there accepts any clip in the bank below.
        <br>Available clips: <b>${clipList()}</b></div>
        <table><tr><th>EVENT</th><th>CLIPS</th><th></th></tr>
        <tr><td>SELECT <span style="color:#567">— tapping a relic</span></td>
            <td><input data-cp="ui.pick" value="${m0(CEDIT.ui.pick)}" placeholder="(synth tick)" style="width:230px"></td>
            <td><button data-cfplay="ui.pick">▶</button></td></tr>
        <tr><td>MOVE <span style="color:#567">— committing a swap</span></td>
            <td><input data-cp="ui.swap" value="${m0(CEDIT.ui.swap)}" placeholder="(synth swap)" style="width:230px"></td>
            <td><button data-cfplay="ui.swap">▶</button></td></tr>
        <tr><td>DENIED <span style="color:#567">— illegal swap</span></td>
            <td><input data-cp="ui.bad" value="${m0(CEDIT.ui.bad)}" placeholder="(synth buzz)" style="width:230px"></td>
            <td><button data-cfplay="ui.bad">▶</button></td></tr></table>

        <div class="hint" style="margin-top:14px">GAMEPLAY MUSIC — plays while a board is live, stops on the menus, and has its
        own 🎵 mute button in game (separate from 🔊). Pick an imported track, or leave it on the built-in synth dirge and
        tune its tempo/key. TEMPO and KEY only affect the synth.</div>
        <div class="row"><b style="color:#9fe86f">TRACK</b><select data-cp="music.clip">${opts}</select>
          <button id="cfMusPrev">▶ TEST</button><span style="color:#7a9">(starts a board to hear it in play)</span></div>
        <div class="row"><b style="color:#9fe86f">VOLUME</b><input type="range" min="0" max="1" step="0.05"
            data-cp="music.volume" value="${m.volume}" style="width:160px"><span>${Math.round(m.volume*100)}%</span></div>
        <div class="row"><b style="color:#9fe86f">TEMPO</b><input type="number" data-cp="music.bpm" value="${m.bpm}" style="width:60px"> BPM
          <b style="color:#9fe86f;margin-left:12px">KEY</b><input type="number" data-cp="music.root" value="${m.root}" style="width:60px"> Hz root</div>

        <div class="hint" style="margin-top:14px">IMPORTED SOUND BANK — drop in your own mp3/ogg/wav and the name becomes usable
        in every SFX field above, and as a music track. Files are stored in this browser (and in the Forge export), so keep them
        small: a few hundred KB for effects, and note that a long music track can fill the ~5 MB storage budget on its own.</div>
        <div class="row"><button id="cfSndAdd">＋ IMPORT SOUND</button></div>
        <table><tr><th>NAME</th><th>SIZE</th><th>VOLUME</th><th></th><th></th></tr>` +
        (Object.keys(CM_AUD).length ? '' : '<tr><td colspan="5" style="color:#567">nothing imported yet</td></tr>') +
        Object.keys(CM_AUD).map(n => `<tr><td style="color:#9fe86f">${n}</td>
          <td>${Math.round((CM_AUD[n].src.length*.75)/1024)} KB</td>
          <td><input type="range" min="0" max="1" step="0.05" data-cfvol="${n}" value="${CM_AUD[n].vol==null?.55:CM_AUD[n].vol}" style="width:110px"></td>
          <td><button data-cfclip="${n}">▶</button></td>
          <td><button class="warn" data-cfsnddel="${n}">✕</button></td></tr>`).join('') + '</table>';
    } else {
      h = `<div class="hint">Values live in this browser's localStorage. Export to keep a copy or move machines.
        Replaced art AND imported sounds are exported too, so a backup is fully self-contained (and can get large).</div>
        <div class="row"><button id="cfExp">⇩ EXPORT JSON</button>
          <button id="cfImpB">⇧ IMPORT JSON</button><input type="file" id="cfImp" accept=".json" style="display:none">
          <button id="cfRst" class="warn">RESET ALL TO DEFAULTS</button></div>`;
    }
    bd.innerHTML = h;
    if (tab===3) wireAudio();
    if (tab===4){
      bd.querySelector('#cfExp').onclick = () => { const a = document.createElement('a');
        a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify({values:CEDIT, art:CM_ART, audio:CM_AUD}, null, 1));
        a.download = 'cryptmatch_forge_backup.json'; a.click(); };
      const imp = bd.querySelector('#cfImp');
      bd.querySelector('#cfImpB').onclick = () => { imp.value = ''; imp.click(); };
      imp.onchange = () => { const f = imp.files[0]; if (!f) return; const rd = new FileReader();
        rd.onload = () => { try { const j = JSON.parse(rd.result);
          if (j.audio) { CM_AUD = j.audio; cmSaveAud(); }      // before cmMerge: music.clip must resolve
          if (j.values) cmMerge(j.values);
          if (j.art) { CM_ART = j.art; cmSaveArt(); }
          cmSave(); cmApply(); draw(); } catch(err){ alert('Bad JSON: ' + err.message); } };
        rd.readAsText(f); };
      bd.querySelector('#cfRst').onclick = () => {
        if (!confirm('Reset every Crypt Forge value, added relic, replaced art and imported sound?')) return;
        CEDIT = JSON.parse(JSON.stringify(CM_BASE)); CM_ART = {}; CM_AUD = {};
        cmSave(); cmSaveArt(); cmSaveAud(); cmApply(); draw(); };
    }
    if (tab===0){
      bd.querySelector('#cfAdd').onclick = () => {
        CEDIT.pieces.push({ name:'Relic ' + (CEDIT.pieces.length+1), value:10, sfx:'bonecrack,bonesnap',
                            color:'#'+((1<<24)+Math.floor(Math.random()*0xffffff)).toString(16).slice(1) });
        cmSave(); cmApply(); draw(); };
      bd.querySelectorAll('[data-cfdel]').forEach(b => b.onclick = () => {
        const i = +b.dataset.cfdel;
        if (!confirm('Delete "' + CEDIT.pieces[i].name + '"? Relics after it shift up one slot, which re-points their art.')) return;
        CEDIT.pieces.splice(i, 1);
        // CM_ART is keyed by slot index, so shift every key above the hole down to keep art with its relic.
        const art = {}; for (const k in CM_ART){ const m = k.match(/^p(\d+)$/);
          if (!m) { art[k] = CM_ART[k]; continue; }
          const n = +m[1]; if (n === i) continue; art['p' + (n > i ? n-1 : n)] = CM_ART[k]; }
        CM_ART = art; cmSaveArt(); cmSave(); cmApply(); draw(); });
    }
    bd.querySelectorAll('[data-cfu]').forEach(inp => inp.oninput = () => {   // unlock level (blank = ungated)
      const id = inp.dataset.cfu, v = inp.value.trim();
      if (v === '') delete CEDIT.unlocks[id]; else CEDIT.unlocks[id] = +v;
      for (const k in GATED_SPECIAL_UNLOCK) if (CEDIT.unlocks[k] === undefined) delete GATED_SPECIAL_UNLOCK[k];
      cmSave(); cmApply(); });
    bd.querySelectorAll('[data-cfart]').forEach(im => im.onclick = () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader();
        rd.onload = () => { const t = new Image();
          t.onload = () => {   // downscale to the 128px cell the game actually draws — keeps localStorage sane
            const c = document.createElement('canvas'); c.width = c.height = 128;
            const s = Math.min(128/t.width, 128/t.height), dw = t.width*s, dh = t.height*s;
            c.getContext('2d').drawImage(t, (128-dw)/2, (128-dh)/2, dw, dh);
            CM_ART[im.dataset.cfart] = c.toDataURL('image/png'); cmSaveArt(); cmApply(); draw(); };
          t.src = rd.result; };
        rd.readAsDataURL(f); };
      inp.click(); });
    bd.querySelectorAll('[data-cfclr]').forEach(x => x.onclick = () => {
      const k = x.dataset.cfclr, m = k.match(/^p(\d+)$/), s = k.match(/^s(\d+)$/);
      delete CM_ART[k]; cmSaveArt();
      const im = m ? SPRITES[+m[1]] : SP_SPRITES[+s[1]];             // restore the shipped asset
      if (im) { im._failed = false; im.src = 'assets/' + (m ? SPRITE_FILES[+m[1]] : SPECIAL_DEFS[+s[1]].file); }
      draw(); });
  }
  /* AUDIO tab wiring: import / preview / re-level / delete clips, and audition the UI voices. */
  function wireAudio(){
    const preview = names => { const l = cmList(names);
      if (!l.length) return alert('No known clip in that field — it will use the built-in synth sound.');
      playRand(l); };
    bd.querySelectorAll('[data-cfplay]').forEach(b => b.onclick = () => {
      const ks = b.dataset.cfplay.split('.'); preview(ks.reduce((a,k)=>a[k], CEDIT)); });
    bd.querySelectorAll('[data-cfclip]').forEach(b => b.onclick = () => playClip(b.dataset.cfclip));
    bd.querySelectorAll('[data-cfvol]').forEach(r => r.oninput = () => {
      const n = r.dataset.cfvol; CM_AUD[n].vol = parseFloat(r.value);
      cmSaveAud(); cmApply(); playClip(n); });                       // audition at the new level
    bd.querySelectorAll('[data-cfsnddel]').forEach(b => b.onclick = () => {
      const n = b.dataset.cfsnddel;
      if (!confirm('Remove "' + n + '"? Any SFX field still naming it falls back to the synth sound.')) return;
      delete CM_AUD[n]; if (CEDIT.music.clip === n) CEDIT.music.clip = '';
      cmSaveAud(); cmSave(); cmApply(); draw(); });
    const musPrev = bd.querySelector('#cfMusPrev');
    if (musPrev) musPrev.onclick = () => { if (CEDIT.music.clip) playClip(CEDIT.music.clip);
      else alert('Synth dirge selected — it only runs on a live board. Close the Forge and start a level to hear it.'); };
    bd.querySelector('#cfSndAdd').onclick = () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'audio/*';
      inp.onchange = () => { const f = inp.files[0]; if (!f) return;
        // ~4 MB of base64 is already most of a 5 MB localStorage budget; refuse rather than corrupt the store.
        if (f.size > 3 * 1024 * 1024 && !confirm('That file is ' + Math.round(f.size/1024/1024*10)/10 +
            ' MB. Browser storage is only about 5 MB total — importing it may fail or crowd out your art. Continue?')) return;
        let name = (prompt('Name this clip (used in the SFX fields):',
                           f.name.replace(/\.[^.]+$/, '').replace(/[^a-z0-9_]/gi, '').slice(0, 20)) || '').trim();
        if (!name) return;
        if (CLIPS[name] && !CM_AUD[name]) return alert('"' + name + '" is a built-in clip name — pick another.');
        const rd = new FileReader();
        rd.onload = () => { const prev = CM_AUD[name];
          CM_AUD[name] = { src: rd.result, vol: .55 };
          if (!cmSaveAud()) { if (prev) CM_AUD[name] = prev; else delete CM_AUD[name]; return; }
          cmApply(); draw(); playClip(name); };
        rd.readAsDataURL(f); };
      inp.click(); };
  }
  function open(){ w.classList.add('on'); draw(); }
  function toggle(){ if (w.classList.contains('on')) w.classList.remove('on'); else open(); }
  addEventListener('keydown', e => { if (e.key === 'F2'){ e.preventDefault(); toggle(); } });
  /* Visible ⚱ opener — shown only on the owner's own builds. Portal players (crazygames.com,
     poki.com, itch, …) get nothing but the F2 shortcut, which they have no reason to press.
     Capacitor serves the APK from localhost/capacitor://, so the phone build DOES get the button. */
  const OWNER_BUILD = /^(localhost|127\.0\.0\.1|\[::1\]|)$/.test(location.hostname)
    || location.protocol === 'capacitor:' || location.search.includes('forge');
  const forgeBtn = document.getElementById('forgeBtn');
  if (OWNER_BUILD){ forgeBtn.classList.remove('hidden');
    forgeBtn.onclick = e => { e.stopPropagation(); toggle(); }; }
  /* There is no F2 on a phone, and the APK is the build the owner actually plays: press-and-hold
     the 🐞 icon for 700 ms to open the Forge there. A plain tap still files a bug report. */
  (function(){ let t = null;
    bugBtn.addEventListener('pointerdown', () => { window.__cfHeld = false;
      t = setTimeout(() => { window.__cfHeld = true; open(); }, 700); });   // bug's onclick reads __cfHeld
    ['pointerup','pointerleave','pointercancel'].forEach(ev => bugBtn.addEventListener(ev, () => clearTimeout(t)));
  })();
})();
resize();
refreshMenu(false);   // pre-populates daily's (hidden) stats; harmless before that screen is ever shown
// Boot: show the title screen, then PLAY starts a campaign board. The ?test= bot (above) already
// calls start() itself once it has set up its own requested mode, so it must not be double-started
// here — and it must NOT be gated behind the title screen, or headless/QA runs would hang on it.
if (!location.search.includes('test')) resumeMode();
setInterval(()=>{ if (!playing) dailyEl.textContent = fmtReset(); }, 30000);
scheduleCreature();   // begin the ambient-creature drift loop (no-op under reduced motion)
music.begin();        // arms the first-gesture unlock + the play/stop poller (see GAMEPLAY MUSIC)
requestAnimationFrame(render);
/* Assets are declared/preloaded and the splash is on screen → tell the portal loading is done. */
PSDK.ready.then(()=>{ try { PSDK.loaded(); } catch(e){} });
</script>

<!-- PWA offline shell. Guarded so it can never throw/break startup when this file is
     served flat inside a CrazyGames/Poki portal iframe (no https, no SW support, etc). -->
<script>
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
} catch (e) {}
</script>
</body>
